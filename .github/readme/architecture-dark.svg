<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" role="img" aria-label="Trommi&#x27;s architecture: the apps draw, core/client decides, core/protocol holds the cryptography, core/wire holds what the hub and the app core read the same way"><title>Trommi&#x27;s architecture: the apps draw, core/client decides, core/protocol holds the cryptography, core/wire holds what the hub and the app core read the same way</title><rect width="900" height="428" fill="#0d1117"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="16" y="16" font-size="11.5" font-weight="600" text-anchor="start" letter-spacing=".04em" fill="#9198a1">APPS: DRAW (NATIVE STAYS)</text><rect x="16.0" y="22" width="208.0" height="50" rx="9" fill="#0c2d4a" stroke="#1f6feb" stroke-width="1.2"/><text x="120.0" y="44" text-anchor="middle" font-size="14" fill="#e6edf3">app/web</text><text x="120.0" y="61" text-anchor="middle" font-size="11.5" fill="#9198a1">HTML, CSS</text><rect x="16.0" y="80" width="208.0" height="46" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="120.0" y="100" text-anchor="middle" font-size="12.5" fill="#e6edf3">fetch, SSE, IndexedDB</text><text x="120.0" y="117" text-anchor="middle" font-size="11.5" fill="#9198a1">Web Push, file picker</text><rect x="232.0" y="22" width="208.0" height="50" rx="9" fill="#0c2d4a" stroke="#1f6feb" stroke-width="1.2"/><text x="336.0" y="44" text-anchor="middle" font-size="14" fill="#e6edf3">app/ios</text><text x="336.0" y="61" text-anchor="middle" font-size="11.5" fill="#9198a1">SwiftUI + Glass: iPhone, iPad, Mac</text><rect x="232.0" y="80" width="208.0" height="46" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="336.0" y="100" text-anchor="middle" font-size="12.5" fill="#e6edf3">URLSession, Keychain</text><text x="336.0" y="117" text-anchor="middle" font-size="11.5" fill="#9198a1">APNs, widgets, Share</text><rect x="448.0" y="22" width="208.0" height="50" rx="9" fill="#0c2d4a" stroke="#1f6feb" stroke-width="1.2"/><text x="552.0" y="44" text-anchor="middle" font-size="14" fill="#e6edf3">app/linux</text><text x="552.0" y="61" text-anchor="middle" font-size="11.5" fill="#9198a1">Qt, QML</text><rect x="448.0" y="80" width="208.0" height="46" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="552.0" y="100" text-anchor="middle" font-size="12.5" fill="#e6edf3">core/io: reqwest, files</text><text x="552.0" y="117" text-anchor="middle" font-size="11.5" fill="#9198a1">notifications, tray</text><text x="16" y="146" font-size="11.5" font-weight="600" text-anchor="start" letter-spacing=".04em" fill="#9198a1">RUST, SHARED, WRITTEN ONCE</text><rect x="16" y="152" width="640" height="62" rx="9" fill="#3a2a0b" stroke="#9e6a03" stroke-width="1.2"/><text x="336.0" y="172.5" text-anchor="middle" font-size="14" fill="#e6edf3">core/client: the app core</text><text x="336.0" y="189.5" text-anchor="middle" font-size="11.5" fill="#9198a1">view models: Desk, sessions, cards, badges, texts · actions and echoes</text><text x="336.0" y="204.5" text-anchor="middle" font-size="11.5" fill="#9198a1">sync: catch-up, live stream, outbox, retries · cache · board model</text><rect x="16" y="222" width="640" height="46" rx="9" fill="#3a2a0b" stroke="#9e6a03" stroke-width="1.2"/><text x="336.0" y="242" text-anchor="middle" font-size="14" fill="#e6edf3">core/protocol</text><text x="336.0" y="259" text-anchor="middle" font-size="11.5" fill="#9198a1">MLS, envelopes, chains, all cryptography</text><rect x="16" y="276" width="640" height="40" rx="9" fill="#3a2a0b" stroke="#9e6a03" stroke-width="1.2"/><text x="336.0" y="300.5" text-anchor="middle" font-size="13" fill="#e6edf3">core/bindings: wasm · UniFFI · plain Rust</text><rect x="688" y="152" width="196" height="62" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="786.0" y="180" text-anchor="middle" font-size="13.5" fill="#e6edf3">connector/</text><text x="786.0" y="197" text-anchor="middle" font-size="11.5" fill="#9198a1">Claude Code and Codex</text><rect x="688" y="222" width="196" height="62" rx="9" fill="#3a2a0b" stroke="#9e6a03" stroke-width="1.2"/><text x="786.0" y="243" text-anchor="middle" font-size="14" fill="#e6edf3">core/wire</text><text x="786.0" y="260" text-anchor="middle" font-size="11.5" fill="#9198a1">codes, limits, formats</text><text x="786.0" y="275" text-anchor="middle" font-size="11.5" fill="#9198a1">no key, no client logic</text><rect x="688" y="306" width="196" height="66" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="786.0" y="328" text-anchor="middle" font-size="13.5" fill="#e6edf3">hub/ (server)</text><text x="786.0" y="345" text-anchor="middle" font-size="11.5" fill="#9198a1">stores ciphertext,</text><text x="786.0" y="360" text-anchor="middle" font-size="11.5" fill="#9198a1">checks MLS changes</text><defs><marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#d29922"/></marker></defs><path d="M786.0,284 V304" fill="none" stroke="#d29922" stroke-width="1.6" marker-end="url(#head)"/><path d="M688,253 H658" fill="none" stroke="#d29922" stroke-width="1.6" marker-end="url(#head)"/><path d="M688,233 H672 V190 H658" fill="none" stroke="#d29922" stroke-width="1.6" marker-end="url(#head)"/><rect x="16" y="382" width="868" height="38" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="450" y="405.5" text-anchor="middle" font-size="13.5" fill="#e6edf3">OpenMLS</text></g></svg>
