<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="Trommi&#x27;s architecture: the apps draw, core/client decides, core/protocol holds the cryptography"><title>Trommi&#x27;s architecture: the apps draw, core/client decides, core/protocol holds the cryptography</title><rect width="900" height="372" fill="#0d1117"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="16" y="16" font-size="11.5" font-weight="600" text-anchor="start" letter-spacing=".04em" fill="#9198a1">APPS: DRAW (NATIVE STAYS)</text><rect x="16.0" y="22" width="215.33333333333334" height="50" rx="9" fill="#0c2d4a" stroke="#1f6feb" stroke-width="1.2"/><text x="123.66666666666667" y="44.0" text-anchor="middle" font-size="14" fill="#e6edf3">app/web</text><text x="123.66666666666667" y="61.0" text-anchor="middle" font-size="11.5" fill="#9198a1">HTML, CSS</text><rect x="239.33333333333334" y="22" width="215.33333333333334" height="50" rx="9" fill="#0c2d4a" stroke="#1f6feb" stroke-width="1.2"/><text x="347.0" y="44.0" text-anchor="middle" font-size="14" fill="#e6edf3">app/ios</text><text x="347.0" y="61.0" text-anchor="middle" font-size="11.5" fill="#9198a1">SwiftUI + Glass: iPhone, iPad, Mac</text><rect x="462.6666666666667" y="22" width="215.33333333333334" height="50" rx="9" fill="#0c2d4a" stroke="#1f6feb" stroke-width="1.2"/><text x="570.3333333333334" y="44.0" text-anchor="middle" font-size="14" fill="#e6edf3">app/linux</text><text x="570.3333333333334" y="61.0" text-anchor="middle" font-size="11.5" fill="#9198a1">Qt, QML</text><rect x="16.0" y="80" width="215.33333333333334" height="46" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="123.66666666666667" y="100.0" text-anchor="middle" font-size="12.5" fill="#e6edf3">fetch, SSE, IndexedDB</text><text x="123.66666666666667" y="117.0" text-anchor="middle" font-size="11.5" fill="#9198a1">Web Push, file picker</text><rect x="239.33333333333334" y="80" width="215.33333333333334" height="46" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="347.0" y="100.0" text-anchor="middle" font-size="12.5" fill="#e6edf3">URLSession, Keychain</text><text x="347.0" y="117.0" text-anchor="middle" font-size="11.5" fill="#9198a1">APNs, widgets, Share</text><rect x="462.6666666666667" y="80" width="215.33333333333334" height="46" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="570.3333333333334" y="100.0" text-anchor="middle" font-size="12.5" fill="#e6edf3">core/io: reqwest, files</text><text x="570.3333333333334" y="117.0" text-anchor="middle" font-size="11.5" fill="#9198a1">notifications, tray</text><text x="16" y="146" font-size="11.5" font-weight="600" text-anchor="start" letter-spacing=".04em" fill="#9198a1">RUST, SHARED, WRITTEN ONCE</text><rect x="16" y="152" width="662" height="62" rx="9" fill="#3a2a0b" stroke="#9e6a03" stroke-width="1.2"/><text x="347.0" y="172.5" text-anchor="middle" font-size="14" fill="#e6edf3">core/client: the app core</text><text x="347.0" y="189.5" text-anchor="middle" font-size="11.5" fill="#9198a1">view models: Desk, sessions, cards, badges, texts · actions and echoes</text><text x="347.0" y="204.5" text-anchor="middle" font-size="11.5" fill="#9198a1">sync: catch-up, live stream, outbox, retries · cache · board model</text><rect x="16" y="222" width="662" height="46" rx="9" fill="#3a2a0b" stroke="#9e6a03" stroke-width="1.2"/><text x="347.0" y="242.0" text-anchor="middle" font-size="14" fill="#e6edf3">core/protocol</text><text x="347.0" y="259.0" text-anchor="middle" font-size="11.5" fill="#9198a1">MLS, envelopes, chains, all cryptography</text><rect x="16" y="276" width="662" height="40" rx="9" fill="#3a2a0b" stroke="#9e6a03" stroke-width="1.2"/><text x="347.0" y="300.5" text-anchor="middle" font-size="13" fill="#e6edf3">core/bindings: wasm · UniFFI · plain Rust</text><rect x="694" y="152" width="190" height="62" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="789.0" y="180.0" text-anchor="middle" font-size="13.5" fill="#e6edf3">connector/</text><text x="789.0" y="197.0" text-anchor="middle" font-size="11.5" fill="#9198a1">Claude Code and Codex</text><rect x="694" y="222" width="190" height="100" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="789.0" y="261.5" text-anchor="middle" font-size="13.5" fill="#e6edf3">hub/ (server)</text><text x="789.0" y="278.5" text-anchor="middle" font-size="11.5" fill="#9198a1">stores ciphertext,</text><text x="789.0" y="293.5" text-anchor="middle" font-size="11.5" fill="#9198a1">checks MLS changes</text><rect x="16" y="326" width="868" height="38" rx="9" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="450.0" y="349.5" text-anchor="middle" font-size="13.5" fill="#e6edf3">OpenMLS</text></g></svg>
