<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-label="Trommi’s architecture: the apps draw; core/client decides; core/protocol and OpenMLS encrypt; the hub only stores and relays ciphertext"><title>Trommi’s architecture: the apps draw; core/client decides; core/protocol and OpenMLS encrypt; the hub only stores and relays ciphertext</title><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><text x="24" y="58" font-size="11" font-weight="600" fill="#818b98" text-anchor="start" letter-spacing=".08em">APPS</text><rect x="128" y="24" width="118.5" height="56" rx="10" fill="#ffffff" stroke="#d1d9e0"/><text x="187.25" y="49" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Web</text><text x="187.25" y="67" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">browser</text><rect x="256.5" y="24" width="118.5" height="56" rx="10" fill="#ffffff" stroke="#d1d9e0"/><text x="315.75" y="49" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">iPhone · Mac</text><text x="315.75" y="67" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">SwiftUI</text><rect x="385" y="24" width="118.5" height="56" rx="10" fill="#ffffff" stroke="#d1d9e0"/><text x="444.25" y="49" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Linux</text><text x="444.25" y="67" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Qt / QML</text><rect x="513.5" y="24" width="118.5" height="56" rx="10" fill="#ffffff" stroke="#d1d9e0"/><text x="572.75" y="49" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Connector</text><text x="572.75" y="67" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">agent sessions</text><text x="24" y="123" font-size="11" font-weight="600" fill="#818b98" text-anchor="start" letter-spacing=".08em">BRIDGE</text><rect x="128" y="96" width="247" height="44" rx="10" fill="#e6f3ee" stroke="#9fcfbf"/><text x="251.5" y="116" font-size="13" font-weight="600" fill="#1b6a57" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">core/bindings</text><text x="251.5" y="132" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">WebAssembly · UniFFI</text><rect x="385" y="96" width="247" height="44" rx="10" fill="#e6f3ee" stroke="#9fcfbf"/><text x="508.5" y="116" font-size="13" font-weight="600" fill="#1b6a57" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">core/io</text><text x="508.5" y="132" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">native I/O, no decisions</text><text x="24" y="190" font-size="11" font-weight="600" fill="#818b98" text-anchor="start" letter-spacing=".08em">APP CORE</text><rect x="128" y="156" width="504" height="58" rx="10" fill="#e6f3ee" stroke="#9fcfbf"/><text x="380" y="181" font-size="14" font-weight="600" fill="#1b6a57" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">core/client</text><text x="380" y="200" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle">every screen’s view model · actions · sync · cache</text><text x="24" y="259" font-size="11" font-weight="600" fill="#818b98" text-anchor="start" letter-spacing=".08em">PROTOCOL</text><rect x="128" y="230" width="247" height="48" rx="10" fill="#e6f3ee" stroke="#9fcfbf"/><text x="251.5" y="251" font-size="13" font-weight="600" fill="#1b6a57" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">core/protocol</text><text x="251.5" y="268" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">MLS · envelopes · chains · files</text><rect x="385" y="230" width="247" height="48" rx="10" fill="#e6f3ee" stroke="#9fcfbf"/><text x="508.5" y="251" font-size="13" font-weight="600" fill="#1b6a57" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">core/wire</text><text x="508.5" y="268" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">formats · limits · refusal codes</text><text x="24" y="319" font-size="11" font-weight="600" fill="#818b98" text-anchor="start" letter-spacing=".08em">CRYPTO</text><rect x="128" y="294" width="728" height="40" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="492" y="319" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">OpenMLS  ·  RFC 9420</text><rect x="676" y="156" width="180" height="122" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="766" y="200" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Hub</text><text x="766" y="222" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">stores and relays</text><text x="766" y="239" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">ciphertext only,</text><text x="766" y="256" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">holds no keys</text><line x1="636" y1="185" x2="672" y2="185" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="3 4"/><text x="654" y="178" font-size="11" font-weight="400" fill="#818b98" text-anchor="middle">sealed</text><line x1="636" y1="254" x2="672" y2="254" stroke="#9fcfbf" stroke-width="1.6"/><text x="24" y="372" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Each layer uses only the layers below it. Green: Rust, written once and shared by every app.</text></g></svg>
