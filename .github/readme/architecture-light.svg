<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="Trommi&#x27;s architecture: the apps draw, core/client decides, core/protocol holds the cryptography"><title>Trommi&#x27;s architecture: the apps draw, core/client decides, core/protocol holds the cryptography</title><rect width="900" height="372" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="16" y="16" font-size="11.5" font-weight="600" text-anchor="start" letter-spacing=".04em" fill="#59636e">APPS: DRAW (NATIVE STAYS)</text><rect x="16.0" y="22" width="215.33333333333334" height="50" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/><text x="123.66666666666667" y="44.0" text-anchor="middle" font-size="14" fill="#1f2328">app/web</text><text x="123.66666666666667" y="61.0" text-anchor="middle" font-size="11.5" fill="#59636e">HTML, CSS</text><rect x="239.33333333333334" y="22" width="215.33333333333334" height="50" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/><text x="347.0" y="44.0" text-anchor="middle" font-size="14" fill="#1f2328">app/ios</text><text x="347.0" y="61.0" text-anchor="middle" font-size="11.5" fill="#59636e">SwiftUI + Glass: iPhone, iPad, Mac</text><rect x="462.6666666666667" y="22" width="215.33333333333334" height="50" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/><text x="570.3333333333334" y="44.0" text-anchor="middle" font-size="14" fill="#1f2328">app/linux</text><text x="570.3333333333334" y="61.0" text-anchor="middle" font-size="11.5" fill="#59636e">Qt, QML</text><rect x="16.0" y="80" width="215.33333333333334" height="46" rx="9" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/><text x="123.66666666666667" y="100.0" text-anchor="middle" font-size="12.5" fill="#1f2328">fetch, SSE, IndexedDB</text><text x="123.66666666666667" y="117.0" text-anchor="middle" font-size="11.5" fill="#59636e">Web Push, file picker</text><rect x="239.333333