# On every pull request and in the merge queue: find which parts changed and check those: clippy, their tests, the
# web app's build; no release binaries, no cross builds, no Mac. A pull request runs the fast tier: every Rust test but
# the slow ones (nextest profile `fast`, .config/nextest.toml); the merge queue runs them all (profile `ci`) on the very
# commit that lands, and that is what main relies on. The giant tests, fuzzing and the torture run with 100 iPhones
# are nightly (nightly.yml, fuzz.yml, clients_mega.yml; a failure opens an issue). The jobs' names are the checks the ruleset of main
# requires (they do not change): Which parts changed, Core (check), Web app (check), Connector (check), Hub (check).
# A part that did not change skips its job, which counts as passed; when finding the changed parts fails, that
# required check fails.
#
# On every commit on main: the same checks, and each part that must be delivered is built and delivered ON ITS OWN, as
# soon as its own checks and the core's passed for this commit (Core (check) passed, or was skipped because the core
# did not change); no part waits for another, and there is no release of every part:
#   web        deploy_web.yml: the files attested and delivered to Cloudflare, then checked from outside and put back
#              when app.trommi.com does not serve exactly them
#   hub        release_part.yml: the signed release hub-v<N>; then deploy_hub.yml: the server takes it
#   connector  release_part.yml: the signed release connector-v<N> (installers and `trommi-connector update` take the
#              newest); when the same commit delivers the hub, only once the server runs that hub
# Whether a part must be delivered is decided against what it has out there, not against the commit before
# (.github/scripts/deployed.sh): a delivery that failed is made again by the next run, and a part that went back is
# delivered again. A part's job builds it then, even when its folder did not change.
# A part whose check job passed in the merge queue (or on the merged pull request) for the very same tree of files does
# not run its tests and clippy again on main; its job still builds what main delivers (.github/scripts/checked_tree.sh).
# When a job fails, the job `report` opens the issue "Main build v<N> failed" (label build-failed); the next run on
# main that passes closes it. The other parts are delivered all the same.
#
# iOS is not in this file, so nothing here waits for a Mac or for TestFlight: ios.yml checks the iOS client on every
# pull request ("iOS client (check)") and, after a run of this file on main, delivers the iPhone app to TestFlight
# (ios.yml) and the Mac app as mac-v<N> (mac.yml) when that run's Core (check) passed and the apps' inputs differ from
# those out there (both read RELEASE_BASE below for N).
#
# Which checks run: a part's tests run when its own folder changed, or core/ or client/, or what pins the build
# (Cargo.toml, Cargo.lock, rust-toolchain.toml), compared with the commit of the newest run on main that passed (on a
# pull request: with its base); so what a failed or replaced run left untested is tested again. A run started by hand
# counts every part as changed.
#
# How a part is wired in (iOS and the Mac: see ios.yml and mac.yml):
#   1. `changes`: one more `part <name> '<its own paths>'` line and one more output; its paths in
#      .github/scripts/inputs.sh, and how its delivered state is read in .github/scripts/deployed.sh.
#   2. a job named after the part: tests, builds, uploads ONE artifact named `<part>-release`.
#   3. its delivery after its job and the core's: deploy_<part>.yml, or release_part.yml for a signed release (its
#      manifest by release/manifest.sh, with the part's inputs), with `secrets: inherit`. The delivery workflow alone
#      uses the part's environment (`web`, `hub`, `connector`, `ios` and `mac` from ios.yml and mac.yml), which holds
#      OP_SERVICE_ACCOUNT_TOKEN and OP_ENVIRONMENT_ID. The number N of a release is this run's number plus
#      RELEASE_BASE: it only grows, and it is the same for every part of one run.
name: build

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue (ruleset of main): the checks of a pull request, on the very commit that will land on main; main
  # then does not run them again (checked_tree.sh)
  merge_group:
  workflow_dispatch:

permissions: {}

# A pull request: one run at a time, a newer commit cuts the older run off.
# Main: one run at a time, and of the runs waiting only the newest: a run that starts is never cut off (it may be
# releasing or delivering), a newer commit replaces the one still waiting (GitHub cancels it before it starts). Nothing
# is lost: every check compares with the commit of the newest release, not with the commit before (`changes`), so the
# newest run tests, builds and releases what the replaced ones would have; the release numbers still only grow (a
# replaced run's number is never used). ios.yml and mac.yml keep a run per release: they follow the published
# releases, and a release that is published is delivered.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || (github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Release numbers are this workflow's run number plus this base. The run number starts again at 1 when this
  # file is renamed or made anew: raise the base then by at least the highest number released so far, because a
  # server never takes a release older than one it has accepted. ios.yml reads this line (`  RELEASE_BASE: <n>`) to
  # find the release of a run.
  RELEASE_BASE: 0
  # The Rust jobs' cache (Swatinem/rust-cache): per job, the downloaded crates (~/.cargo) and the compiled ones
  # (target/, without the workspace's own crates), keyed by the compiler, Cargo.lock and the job. Only a run on main
  # saves; a pull request restores main's (GitHub lets a branch read the caches of the default branch, not those of
  # other branches) and saves nothing. All jobs together stay well under GitHub's 10 GB per repository; a new
  # prefix-key starts them anew (the old entries expire unused after seven days).
  # (sccache on the GitHub Actions cache was tried: one cache entry per compiled crate, over 2000 entries, up to 400
  # write errors per job from the cache service's limits, 10-40 % hits, and in its first runs the jobs slower than with
  # target/ cached.
  # sccache on a bucket of its own (Cloudflare R2) would avoid the limits; the next step if this is not enough.)
  # Incremental compilation is not worth caching in CI and makes target/ larger.
  CARGO_INCREMENTAL: '0'
  # cargo-nextest (.config/nextest.toml): the scenario tests, each test a process of its own, many at once
  NEXTEST_PROFILE: ci
  NEXTEST_VERSION: 0.9.148

jobs:
  changes:
    name: Which parts changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # main: the runs, jobs and artifacts of the pull request this commit came from (checked_tree.sh)
      actions: read
    outputs:
      core: ${{ steps.find.outputs.core }}
      web: ${{ steps.find.outputs.web }}
      connector: ${{ steps.find.outputs.connector }}
      hub: ${{ steps.find.outputs.hub }}
      version: ${{ steps.find.outputs.version }}
      # fast on a pull request (every test but the slow ones), full everywhere else (the merge queue gates main)
      tier: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
      parts: ${{ steps.inputs.outputs.parts }}
      since: ${{ steps.inputs.outputs.since }}
      # main: the part must be delivered (what it has out there differs from this commit); its job builds it
      deliver_web: ${{ steps.inputs.outputs.web }}
      deliver_connector: ${{ steps.inputs.outputs.connector }}
      deliver_hub: ${{ steps.inputs.outputs.hub }}
      # main: the part's check passed on the pull request for this very tree; its tests and clippy are not run again
      checked_core: ${{ steps.checked.outputs.core }}
      checked_web: ${{ steps.checked.outputs.web }}
      checked_connector: ${{ steps.checked.outputs.connector }}
      checked_hub: ${{ steps.checked.outputs.hub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Main only: which parts must be delivered, each against what it has out there (.github/scripts/deployed.sh:
      # app.trommi.com's build, the hub's server, the newest connector-v<N>), not against the commit before: a part
      # whose delivery failed is delivered again, and so is one that went back. Its job then builds it (and checks it,
      # see `find`). And the commit of the newest run on main that passed: every check compares with it, so what a
      # failed or replaced run left untested is tested again.
      - name: What each part must deliver
        id: inputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh .github/scripts/inputs.sh > "$RUNNER_TEMP/inputs"
          cat "$RUNNER_TEMP/inputs"
          sh .github/scripts/deployed.sh "$RUNNER_TEMP/inputs" web hub connector > "$RUNNER_TEMP/deliver"
          cat "$RUNNER_TEMP/deliver" >> "$GITHUB_OUTPUT"
          deliver() { sed -n "s/^$1=//p" "$RUNNER_TEMP/deliver"; }
          # lines `<part> <inputs sha256> <delivered now>` for the manifests (hub/updater: whether a program changed)
          : > "$RUNNER_TEMP/parts"
          while read -r part sum; do
            case $part in hub|updater) flag=$(deliver hub) ;; web|connector) flag=$(deliver "$part") ;; *) continue ;; esac
            echo "$part $sum $flag" >> "$RUNNER_TEMP/parts"
            echo "- $part: $([ "$flag" = true ] && echo "delivered" || echo "out there already")" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/inputs"
          { echo "parts<<PARTS_END"; cat "$RUNNER_TEMP/parts"; echo "PARTS_END"; } >> "$GITHUB_OUTPUT"
          since=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""') || since=
          printf '%s' "$since" | grep -Eq '^[0-9a-f]{40}$' || since=
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "- checks compared with ${since:-nothing (every part counts as changed)}" >> "$GITHUB_STEP_SUMMARY"
      - name: Find the changed parts
        id: find
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
          SINCE: ${{ steps.inputs.outputs.since }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          echo "version=$((RUN_NUMBER + RELEASE_BASE))" >> "$GITHUB_OUTPUT"
          base=
          case "$EVENT" in
            # main: since the newest run on main that passed (see above); a main build that failed or was cancelled
            # leaves its changes in that range, so the next one runs their checks again (not only the last push's)
            push) if [ "$MAIN" = true ]; then base=$SINCE; else base=$BEFORE; fi ;;
            pull_request|merge_group) base=$(git merge-base "$PR_BASE" HEAD || true) ;;
          esac
          # no known commit to compare with (a run by hand, a first push, a rewritten branch): everything changed
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            all=0
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/files"
            echo "compared with $base: $(wc -l < "$RUNNER_TEMP/files") file(s) changed"
          else
            all=1
            : > "$RUNNER_TEMP/files"
            echo "nothing to compare with: every part counts as changed"
          fi
          shared='core/|client/|Cargo\.toml$|\.config/nextest\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/build\.yml$|\.github/scripts/inputs\.sh$'
          # part <job> '<its own paths>' [<its parts in the release>]: the job runs when its paths changed since the commit
          # compared with (main: the newest green run's), and (main) when one of its parts must be delivered, to build
          # them
          part() {
            if [ "$all" = 1 ] || grep -Eq "^($2|$shared)" "$RUNNER_TEMP/files"; then value=true; else value=false; fi
            if [ -n "${3:-}" ] && grep -Eqs "^($3) [0-9a-f]{64} true$" "$RUNNER_TEMP/parts"; then value=true; fi
            echo "$1=$value" >> "$GITHUB_OUTPUT"
            echo "$1: $value"
            echo "- $1: $value" >> "$GITHUB_STEP_SUMMARY"
          }
          # (connector/tools.json and prompt.md, demo/: the app's build reads them)
          # the core itself: its sources (core/ is in `shared`), its tests, the test library, the vectors
          part core 'tests/core/|tests/src/|tests/bindings/|tests/Cargo\.toml$|spec/vectors/|spec/account-vectors\.json$|THIRD-PARTY\.md$|\.github/scripts/third_party\.mjs$'
          part web 'app/web/|tests/web/|connector/tools\.json$|connector/prompt\.md$|demo/|\.node-version$|\.github/scripts/(web_release\.mjs|web_smoke\.sh|deployed\.sh)$|\.github/tools/wrangler/|\.github/workflows/deploy_web\.yml$' web
          part connector 'connector/|release/|install\.sh$|\.claude-plugin/|tests/connector/|tests/Cargo\.toml$|\.github/workflows/release_part\.yml$' connector
          part hub 'hub/|release/|tests/hub/|tests/deploy/|tests/Cargo\.toml$|\.github/workflows/(deploy_hub|release_part)\.yml$|\.github/scripts/(hub_compat|deployed)\.sh$' 'hub|updater'
      # A pull request: the tree it checked (the merge GitHub made), named by an artifact, for checked_tree.sh on main.
      # The name is the claim; checked_tree.sh takes the jobs' results from GitHub, not from this file.
      - name: The tree this run checks
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tree" && echo "TREE=$(cat "$RUNNER_TEMP/tree")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          name: checked-tree-${{ env.TREE }}
          path: ${{ runner.temp }}/tree
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      # Main (a push): which parts' checks passed on the pull request this commit came from, for this very tree.
      # Those parts' jobs still build what main releases, but do not run their tests and clippy again.
      - name: Checks passed on the pull request for this tree
        id: checked
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh .github/scripts/checked_tree.sh > "$RUNNER_TEMP/checked"
          cat "$RUNNER_TEMP/checked" >> "$GITHUB_OUTPUT"
          { echo "checked on the pull request, not run again:"; sed 's/^/- /' "$RUNNER_TEMP/checked"; } >> "$GITHUB_STEP_SUMMARY"

  # The shared core's own tests: the crates' unit tests and the scenario tests under tests/core and tests/bindings.
  # Every other part builds on the core, and none of their jobs runs these. It builds and delivers nothing.
  core:
    name: Core (check)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (only the targets and components this job needs: .github/scripts/rust_toolchain.sh)
      - name: Compiler (rust-toolchain.toml), clippy
        run: sh .github/scripts/rust_toolchain.sh --component clippy
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: cache
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Checked on the pull request for this very tree (main, see `changes`): nothing runs again, except that the
      # tests and clippy are still compiled (not run) when this job's cache missed, so that what main saves for the
      # pull requests holds them. RUN is --no-run then.
      - name: What runs
        id: what
        env:
          CHECKED: ${{ needs.changes.outputs.checked_core }}
          HIT: ${{ steps.cache.outputs.cache-hit }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: sh .github/scripts/checked_run.sh
      # cargo-nextest, the prebuilt binary of the pinned version (its checksum checked by the action)
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: steps.what.outputs.compile == 'true'
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Clippy
        if: steps.what.outputs.compile == 'true'
        run: cargo clippy --locked -p trommi-core -p trommi-client-core -p trommi-core-wasm -p trommi-core-swift --all-targets -- -D warnings
      # the licence tables are what cargo reports for this Cargo.lock (.github/scripts/third_party.mjs)
      - name: THIRD-PARTY.md is current
        if: steps.what.outputs.compile == 'true'
        run: node .github/scripts/third_party.mjs --check
      - name: The crates' own tests
        if: steps.what.outputs.compile == 'true'
        env:
          RUN: ${{ steps.what.outputs.run }}
          NEXTEST_PROFILE: ${{ steps.what.outputs.profile }}
        run: |
          # shellcheck disable=SC2086
          cargo test --locked $RUN -p trommi-core -p trommi-client-core -p trommi-core-wasm -p trommi-core-swift
      # One test that fails must not hide the others: every target runs, the step fails at the end.
      - name: The scenario tests (tests/core, tests/bindings) and the test library
        if: steps.what.outputs.compile == 'true'
        env:
          RUN: ${{ steps.what.outputs.run }}
          NEXTEST_PROFILE: ${{ steps.what.outputs.profile }}
        run: |
          set -eu
          tests=$(sed -n 's/^name = "\(\(core\|bindings\)_[a-z0-9_]*\)"$/--test \1/p' tests/Cargo.toml | tr '\n' ' ')
          [ -n "$tests" ] || { echo "::error::tests/Cargo.toml names no core test"; exit 1; }
          # shellcheck disable=SC2086
          cargo nextest run --locked $RUN -p trommi-tests --no-fail-fast --lib $tests

  web:
    name: Web app (check)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The hub the app speaks to. The build is checked against it: the page's policy must name this hub and no other.
      WEB_HUB_URL: https://hub.trommi.com
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      # The Rust core for the browser (core/wasm/pkg) as core/wasm/build.sh made it on main from the very same inputs:
      # the committed files of the core, the client core, the workspace's pins and this file (the build is
      # reproducible: the same sources give the same bytes). Only main saves it; a pull request reads main's. A change
      # of the web app alone then compiles no Rust. The compiler is still installed: the build's manifest names it.
      - name: The core's inputs
        id: core
        run: echo "key=wasm-pkg-v1-$(git ls-tree -r HEAD -- core client Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/build.yml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pkg
        with:
          path: core/wasm/pkg
          key: ${{ steps.core.outputs.key }}
      - name: Compiler (rust-toolchain.toml)
        run: |
          set -eu
          sh .github/scripts/rust_toolchain.sh wasm32-unknown-unknown
          echo "WASM_BINDGEN=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' core/wasm/Cargo.toml)" >> "$GITHUB_ENV"
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.pkg.outputs.cache-hit != 'true'
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pkg.outputs.cache-hit != 'true'
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ env.WASM_BINDGEN }}-${{ hashFiles('rust-toolchain.toml') }}
      # the command must be the version of the crate in Cargo.lock (core/wasm/build.sh checks it)
      - name: wasm-bindgen
        if: steps.pkg.outputs.cache-hit != 'true' && steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
      - name: Packages
        working-directory: app/web
        run: npm ci --no-audit --no-fund
      - name: The Rust core for the browser
        if: steps.pkg.outputs.cache-hit != 'true'
        run: sh core/wasm/build.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pkg.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: core/wasm/pkg
          key: ${{ steps.core.outputs.key }}
      # Taken from the cache: its files are older than this checkout's, and the web app's build makes the core anew
      # when they look older than its sources (app/web/dev/build.mjs): they are marked as made now, and checked.
      - name: The Rust core for the browser, as made before
        if: steps.pkg.outputs.cache-hit == 'true'
        run: |
          set -eu
          touch core/wasm/pkg/*
          cat core/wasm/pkg/build.json
          for f in trommi_core_wasm_bg.wasm trommi_core_wasm.js trommi-core.js idb-store.js; do
            [ "$(sha256sum "core/wasm/pkg/$f" | cut -d' ' -f1)" = "$(jq -r --arg f "$f" '.[$f].sha256' core/wasm/pkg/build.json)" ] \
              || { echo "::error::core/wasm/pkg/$f is not the file its build.json names"; exit 1; }
          done
      # (main: not again when it passed on the pull request for this very tree, see `changes`)
      # six test files at once on the runner's four cores (package.json: WEB_TEST_CONCURRENCY; the default, three,
      # took about 64 s, six about 39 s: most files wait on timers and a fake hub)
      - name: Test
        if: needs.changes.outputs.checked_web != 'true'
        working-directory: app/web
        env:
          WEB_TEST_CONCURRENCY: '6'
        run: npm test
      # The build: on a pull request as a check; on main the build that is delivered, only when the web app must be
      # delivered (what app.trommi.com serves differs, see `changes`).
      - name: Build
        if: needs.changes.outputs.deliver_web != 'false'
        run: node app/web/dev/build.mjs --write
      # What is delivered (main only): the files, the worker, its settings, and the manifest that names every file.
      - name: Put the release together
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_web != 'false'
        run: |
          set -eu
          node .github/scripts/web_release.mjs app/web/public out
          (cd out && sha256sum -c --quiet checksums.txt)
          # the settings are tried as wrangler reads them; nothing is sent
          npm ci --no-audit --no-fund --ignore-scripts --prefix .github/tools/wrangler
          (cd out && WRANGLER_SEND_METRICS=false ../.github/tools/wrangler/node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry")
          {
            echo "### Web app, build $VERSION"
            echo
            echo "hub \`$WEB_HUB_URL\`, $(jq '.files | length' out/manifest.json) files, manifest \`$(sha256sum out/manifest.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_web != 'false'
        with:
          name: web-release
          path: out/
          if-no-files-found: error
          retention-days: 30
      # The web app's own release web-v<N> (release_part.yml, after the delivery): web.tar.gz (the same bytes for the
      # same files: names sorted, no times, no owners) and a manifest that names it, with the web app's inputs.
      - name: The web app's release
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_web != 'false'
        env:
          ALL_PARTS: ${{ needs.changes.outputs.parts }}
        run: |
          set -eu
          mkdir webrel
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C out -cf - . | gzip -9n > webrel/web.tar.gz
          PARTS=$(printf '%s\n' "$ALL_PARTS" | grep -E '^web [0-9a-f]{64} (true|false)$' || true)
          [ -n "$PARTS" ] || { echo "::error::the web app's inputs are not known"; exit 1; }
          PARTS="$PARTS" release/manifest.sh trommi-web "$VERSION" "$GITHUB_SHA" webrel/web.tar.gz > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" webrel/manifest.json
          release/sign.sh files webrel/manifest.json
          cat webrel/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_web != 'false'
        with:
          name: web-part-release
          path: webrel/
          if-no-files-found: error
          retention-days: 30

  # The web app goes to Cloudflare as soon as its own checks and the core's passed for this commit (the core's job
  # passed, or was skipped because the core did not change): it does not wait for any other part. A browser cannot
  # check a signed release; what vouches for the files is their build attestation, and the smoke test after the
  # delivery (deploy_web.yml) puts the build before back when app.trommi.com does not serve exactly this one.
  deploy_web:
    name: Web app
    needs: [changes, core, web]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_web == 'true'
      && needs.web.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.core.result) }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      # deploy_web.yml's job report opens or closes the issue of a failed delivery
      issues: write
    uses: ./.github/workflows/deploy_web.yml
    with:
      version: ${{ needs.changes.outputs.version }}
      commit: ${{ github.sha }}
      artifact: web-release
    secrets: inherit

  connector:
    name: Connector (check)
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Compiler (rust-toolchain.toml), clippy
        run: sh .github/scripts/rust_toolchain.sh --component clippy
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: cache
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # (main: as in the job core)
      - name: What runs
        id: what
        env:
          CHECKED: ${{ needs.changes.outputs.checked_connector }}
          HIT: ${{ steps.cache.outputs.cache-hit }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: sh .github/scripts/checked_run.sh
      # cargo-nextest, the prebuilt binary of the pinned version (its checksum checked by the action)
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: steps.what.outputs.compile == 'true'
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Clippy
        if: steps.what.outputs.compile == 'true'
        run: cargo clippy --locked -p trommi-connector --all-targets -- -D warnings
      # The scenario tests start the hub of this repository and the built connector (tests/connector/common/mod.rs).
      - name: Test
        if: steps.what.outputs.compile == 'true'
        env:
          RUN: ${{ steps.what.outputs.run }}
          NEXTEST_PROFILE: ${{ steps.what.outputs.profile }}
        run: |
          set -eu
          cargo build --locked -p trommi-hub -p trommi-connector
          tests=$(sed -n 's/^name = "\(connector_[a-z0-9_]*\)"$/--test \1/p' tests/Cargo.toml | tr '\n' ' ')
          [ -n "$tests" ] || { echo "::error::tests/Cargo.toml names no connector test"; exit 1; }
          # shellcheck disable=SC2086
          # TROMMI_HUB_SERVES_REMOVAL: this repository's hub has the removal route, so a removed connector must verify
          # its removal there (without it the test accepts a connector that only keeps its state)
          TROMMI_HUB_SERVES_REMOVAL=1 TROMMI_HUB_BIN="$PWD/target/debug/trommi-hub" cargo nextest run --locked $RUN -p trommi-tests --no-fail-fast $tests

  # Main only, and only when the connector must be delivered (the newest connector-v<N> was built from other inputs,
  # see `changes`): the four release binaries, as connector/build-plugin.mjs makes them, one machine per target at
  # the same time (one after another they took 11-12 minutes) and beside the job connector's tests. The job
  # connector_release puts them together.
  connector_build:
    name: Connector build (${{ matrix.target }})
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.connector == 'true' && needs.changes.outputs.deliver_connector != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # one target that does not build stops the others: there is no release without all four
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      TARGET: ${{ matrix.target }}
      # what the macOS binaries are linked with (connector/build-plugin.mjs): zig, by its published SHA-256, and
      # cargo-zigbuild
      ZIG_VERSION: 0.14.1
      ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
      ZIGBUILD_VERSION: 0.23.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # clang compiles ring's C for the Linux targets; zig links the macOS ones
      - name: Compiler (rust-toolchain.toml), clang, zig
        run: |
          set -eu
          sh .github/scripts/rust_toolchain.sh "$TARGET"
          clang --version | head -n 1
          case "$TARGET" in *-apple-darwin) ;; *) exit 0 ;; esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components 1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/zig/zig" version
      # the downloaded and compiled crates of this target (see env above); only main runs this job
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: zigbuild
        if: endsWith(matrix.target, '-apple-darwin')
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}-${{ env.ZIGBUILD_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: cargo-zigbuild
        if: endsWith(matrix.target, '-apple-darwin') && steps.zigbuild.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --version "$ZIGBUILD_VERSION" --locked
      # A target that did not build is an error here, not a smaller release.
      - name: Build
        run: |
          set -eu
          # the release number is compiled in: a connector refuses a release older than itself (update.rs)
          TROMMI_RELEASE_VERSION="$VERSION" node connector/build-plugin.mjs "$RUNNER_TEMP/dist" --targets "$TARGET"
          [ -f "$RUNNER_TEMP/dist/trommi-connector-$TARGET" ] || { echo "::error::no build for $TARGET"; exit 1; }
          mkdir out
          cp "$RUNNER_TEMP/dist/trommi-connector-$TARGET" out/
          file "out/trommi-connector-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-build-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  # The connector's release: the four binaries of connector_build and the manifest that names them (the plugin for
  # Claude Code is no release file: it is the folder connector/plugin, which names the installed connector).
  connector_release:
    name: Connector release
    needs: [changes, connector_build]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.connector == 'true' && needs.changes.outputs.deliver_connector != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      ALL_PARTS: ${{ needs.changes.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: connector-build-*
          merge-multiple: true
          path: out/
      - name: Put the release together
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "out/trommi-connector-$target" ] || { echo "::error::no build for $target"; exit 1; }
            # an artifact does not keep the executable bit
            chmod 755 "out/trommi-connector-$target"
            file "out/trommi-connector-$target"
          done
          [ "$(find out -type f | wc -l)" = 4 ] || { echo "::error::out/ holds more than the four binaries"; ls -la out; exit 1; }
          for f in out/trommi-connector-*-linux-musl; do
            file "$f" | grep -Eq 'static(ally|-pie) linked' || { echo "::error::$f is not a static binary"; exit 1; }
          done
          # the connector's inputs (whether a later commit must publish it again: .github/scripts/deployed.sh)
          PARTS=$(printf '%s\n' "$ALL_PARTS" | grep -E '^connector [0-9a-f]{64} (true|false)$' || true)
          [ -n "$PARTS" ] || { echo "::error::the connector's inputs are not known"; exit 1; }
          PARTS="$PARTS" release/manifest.sh trommi-connector "$VERSION" "$GITHUB_SHA" out/* > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" out/manifest.json
          release/sign.sh files out/manifest.json
          cat out/manifest.json
      # The very file that will be released is started once.
      - name: Try the built connector
        run: out/trommi-connector-x86_64-unknown-linux-musl --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  hub:
    name: Hub (check)
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # and, for the release build (main), the static target and the C compiler for it, fetched beside the compiler
      - name: Compiler (rust-toolchain.toml), clippy, the C compiler for static builds
        env:
          STATIC: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_hub != 'false' }}
        run: |
          set -eu
          if [ "$STATIC" = true ]; then
            { sudo apt-get update -q && sudo apt-get install -y -q musl-tools; } > "$RUNNER_TEMP/apt.log" 2>&1 &
            apt=$!
            sh .github/scripts/rust_toolchain.sh --component clippy "$TARGET"
            wait "$apt" || { cat "$RUNNER_TEMP/apt.log"; echo "::error::musl-tools could not be installed"; exit 1; }
            tail -n 3 "$RUNNER_TEMP/apt.log"
          else
            sh .github/scripts/rust_toolchain.sh --component clippy
          fi
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: cache
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # (main: as in the job core)
      - name: What runs
        id: what
        env:
          CHECKED: ${{ needs.changes.outputs.checked_hub }}
          HIT: ${{ steps.cache.outputs.cache-hit }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: sh .github/scripts/checked_run.sh
      # cargo-nextest, the prebuilt binary of the pinned version (its checksum checked by the action)
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: steps.what.outputs.compile == 'true'
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Clippy
        if: steps.what.outputs.compile == 'true'
        run: cargo clippy --locked -p trommi-hub -p trommi-hub-updater --all-targets -- -D warnings
      # the hub's tests and the deploy path's (updater, release form, settings)
      - name: Test
        if: steps.what.outputs.compile == 'true'
        env:
          RUN: ${{ steps.what.outputs.run }}
          NEXTEST_PROFILE: ${{ steps.what.outputs.profile }}
        run: |
          set -eu
          tests=$(sed -n 's/^name = "\(\(hub\|deploy\)_[a-z0-9_]*\)"$/--test \1/p' tests/Cargo.toml | tr '\n' ' ')
          [ -n "$tests" ] || { echo "::error::tests/Cargo.toml names no hub test"; exit 1; }
          # shellcheck disable=SC2086
          cargo nextest run --locked $RUN -p trommi-tests --no-fail-fast $tests
      - name: Scripts of the deploy path
        run: |
          set -eu
          # notes of the lowest level differ between shellcheck versions and do not stop the build
          shellcheck -S warning release/*.sh hub/deploy/*.sh
          bash hub/deploy/install.sh check
      # The files of the release: both programs as static binaries and the manifest that
      # names them. The commit is compiled in; paths of the build machine are not. Main only, and only when the hub must
      # be delivered (what the server has differs, see `changes`).
      - name: Build the release
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_hub != 'false'
        env:
          TROMMI_COMMIT: ${{ github.sha }}
          ALL_PARTS: ${{ needs.changes.outputs.parts }}
        run: |
          set -eu
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --profile dist --locked --target "$TARGET" -p trommi-hub -p trommi-hub-updater
          mkdir out
          cp "target/$TARGET/dist/trommi-hub" "out/trommi-hub-$TARGET"
          cp "target/$TARGET/dist/trommi-hub-updater" "out/trommi-hub-updater-$TARGET"
          for f in "out/trommi-hub-$TARGET" "out/trommi-hub-updater-$TARGET"; do
            file "$f" | grep -Eq 'static(ally|-pie) linked' || { echo "::error::$f is not a static binary"; exit 1; }
          done
          # the inputs of the hub and of the updater: the server decides by them whether a program changed (hub/updater)
          PARTS=$(printf '%s\n' "$ALL_PARTS" | grep -E '^(hub|updater) [0-9a-f]{64} (true|false)$' || true)
          [ "$(printf '%s\n' "$PARTS" | grep -c .)" = 2 ] || { echo "::error::the inputs of the hub and the updater are not known"; exit 1; }
          PARTS="$PARTS" DATA_EPOCH=$(tr -d ' \n' < hub/data-epoch) release/manifest.sh trommi-hub "$VERSION" "$GITHUB_SHA" out/* > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" out/manifest.json
          release/sign.sh files out/manifest.json
          cat out/manifest.json
      # The very file that will be released is started once and asked whether it is well and which commit it is.
      - name: Try the built hub
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_hub != 'false'
        run: |
          set -eu
          data=$(mktemp -d)
          HUB_HOST=127.0.0.1 HUB_PORT=18790 HUB_DATA="$data" HUB_QUIET=1 "out/trommi-hub-$TARGET" &
          pid=$!
          got=
          for _ in $(seq 1 20); do
            if got=$(curl -fsS --max-time 2 http://127.0.0.1:18790/healthz); then break; fi
            sleep 0.5
          done
          kill "$pid" || true
          [ -n "$got" ] || { echo "::error::the built hub did not answer"; exit 1; }
          echo "$got"
          [ "$(printf '%s' "$got" | jq -r .commit)" = "$GITHUB_SHA" ] || { echo "::error::the built hub does not report this commit"; exit 1; }
      # Expand, then contract (hub/deploy/README.md, "Migrations"): the hub of the newest release must still start
      # and answer on a database this build's hub has migrated, so that putting the program back after a failed
      # deploy is always safe. A build that raises hub/data-epoch declares that it is not; the check is then skipped
      # and the updater never puts the program back past it once the new hub has served.
      - name: The hub before runs on data this one migrated
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_hub != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/hub_compat.sh "out/trommi-hub-$TARGET" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_hub != 'false'
        with:
          name: hub-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  # The web app's signed release web-v<N> (release_part.yml), once it is delivered: the release notes of that
  # delivery, and web.tar.gz as it was delivered (attested). A browser checks no signature; it is the record of what
  # went out, and the build to put back.
  release_web:
    name: Web release
    needs: [changes, deploy_web]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.deploy_web.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release_part.yml
    with:
      part: web
      version: ${{ needs.changes.outputs.version }}
      commit: ${{ github.sha }}
      artifact: web-part-release
    secrets: inherit

  # The hub's signed release hub-v<N> (release_part.yml), as soon as the hub's checks and the core's passed for this
  # commit; then the server takes it. The hub does not wait for any other part.
  release_hub:
    name: Hub release
    needs: [changes, core, hub]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_hub == 'true'
      && needs.hub.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.core.result) }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release_part.yml
    with:
      part: hub
      version: ${{ needs.changes.outputs.version }}
      commit: ${{ github.sha }}
      artifact: hub-release
    secrets: inherit

  # The server fetches the release itself; it restarts the hub only when the hub's inputs differ from those of the
  # release it runs (hub/updater).
  deploy_hub:
    name: Hub
    needs: [changes, release_hub]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release_hub.outputs.published == 'true' }}
    permissions:
      id-token: write
      # deploy_hub.yml's job report opens or closes the issue of a failed delivery
      contents: read
      issues: write
    uses: ./.github/workflows/deploy_hub.yml
    with:
      tag: ${{ needs.release_hub.outputs.tag }}
    secrets: inherit

  # The connector's signed release connector-v<N>: published is delivered (install.sh and `trommi-connector update`
  # take the newest at once), so only when its checks, its four builds and the core's checks passed for this commit,
  # and, when this commit also delivers the hub, only once the server runs that hub (a new connector may speak to the
  # hub as it is from now on). It waits for no other part.
  release_connector:
    name: Connector release (signed)
    needs: [changes, core, connector, connector_release, deploy_hub]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.deliver_connector == 'true'
      && needs.connector.result == 'success' && needs.connector_release.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.core.result)
      && (needs.changes.outputs.deliver_hub != 'true' || needs.deploy_hub.result == 'success') }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release_part.yml
    with:
      part: connector
      version: ${{ needs.changes.outputs.version }}
      commit: ${{ github.sha }}
      artifact: connector-release
    secrets: inherit

  # A run on main: when a part's job or the release failed, open the issue "Main build v<N> failed" (label build-failed)
  # or comment on the open one; when all passed, close it. A failed delivery has its own issue (deploy_*.yml).
  report:
    name: Report
    needs: [changes, core, web, deploy_web, release_web, connector, connector_build, connector_release, release_connector, hub, release_hub, deploy_hub]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.changes.outputs.version }}
      WHAT: build
      RUNNING: the commit built, ${{ github.sha }}
      LABEL: build-failed
      RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: |
          set -eu
          # the jobs that failed, by their names in this file
          REASON="failed: $(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')"
          export REASON
          sh .github/scripts/deploy_issue.sh Main
