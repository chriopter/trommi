# On every pull request: find which parts changed and check those, fast: their tests, clippy, the web app's build; no
# release binaries, no cross builds, no Mac. The jobs' names are the checks the ruleset of main requires (they do not
# change): Which parts changed, Core (check), Web app (check), Connector (check), Hub (check).
# A part that did not change skips its job, which counts as passed.
# On every commit on main: the same checks, and the full builds of the changed parts (release binaries). When one of
# them fails, the job `report` opens the issue "Main build v<N> failed" (label build-failed) and nothing is released
# or delivered; the next run on main that passes closes it.
# On main also:
# when what a part is built from changed since the newest release, make one release v<N> of every part
# (release.yml) and deliver each part whose inputs changed (web, hub; the connector is delivered by the release
# itself: installers and `trommi-connector update` take the newest).
#
# iOS is not in this file, so nothing here waits for a Mac or for TestFlight: ios.yml checks the iOS client on every
# pull request ("iOS client (check)") and, after a run of this file on main, delivers the app to TestFlight when that
# run's release v<N> marks iOS changed (ios.yml reads RELEASE_BASE below for N). The release still counts iOS among
# its parts (.github/scripts/inputs.sh): an iOS-only change makes a release, and only a released app ships.
#
# Which jobs run: a part's tests and build run when its own folder changed, or core/ or client/, or what pins the build
# (Cargo.toml, Cargo.lock, rust-toolchain.toml), compared with the commit before (on a pull request: with its base).
# Whether there is a release: .github/scripts/inputs.sh hashes, per part, what its build reads (the paths of the
# commit, by git); the release is made when one hash differs from the newest release's manifest. A part whose hash
# differs is built (its job runs even when its folder did not change since the commit before); a part whose hash is
# the newest release's runs its tests when its folder changed, but not its build: release.yml takes its files from
# that release, checked against its signed manifest. When the newest release cannot be read or checked, every part
# counts as changed and is built. A pull request has no release to compare with: what runs, builds. A run started by
# hand counts every part as changed for its tests.
#
# How a part is wired in (the same three steps for web, connector and hub; iOS: see ios.yml):
#   1. `changes`: one more `part <name> '<its own paths>'` line and one more output.
#   2. a job named after the part: tests, builds, uploads ONE artifact named `<part>-release`.
#   3. its paths in .github/scripts/inputs.sh, its files in release.yml, and (when it is delivered somewhere) a job
#      `deploy_<part>` after `release` that calls `.github/workflows/deploy_<part>.yml` with
#        version:  the release number of this run (see `changes`): a whole number that only grows, the same for
#                  every part built by one run
#        commit:   the commit that was built
#        artifact: `<part>-release`
#      and `secrets: inherit`. The deploy workflow alone uses the part's environment (`web`, `hub`, `connector`,
#      `ios` from ios.yml), which holds OP_SERVICE_ACCOUNT_TOKEN and OP_ENVIRONMENT_ID.
#
# The release is signed: release/manifest.sh writes manifest.json, release/sign.sh signs and checks it, the public
# key is release/public-key.pem. The artifact of a part holds its files (hub and connector: with a manifest of their
# own, checked when the release is put together); release.yml signs and publishes.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A pull request: one run at a time, a newer commit cuts the older run off. On main every run is its own group:
# each compares with the commit before it, so a run dropped while waiting would be a change never built.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Release numbers are this workflow's run number plus this base. The run number starts again at 1 when this
  # file is renamed or made anew: raise the base then by at least the highest number released so far, because a
  # server never takes a release older than one it has accepted. ios.yml reads this line (`  RELEASE_BASE: <n>`) to
  # find the release of a run.
  RELEASE_BASE: 0
  # The Rust jobs' cache (Swatinem/rust-cache): per job, the downloaded crates (~/.cargo) and the compiled ones
  # (target/, without the workspace's own crates), keyed by the compiler, Cargo.lock and the job. Only a run on main
  # saves; a pull request restores main's (GitHub lets a branch read the caches of the default branch, not those of
  # other branches) and saves nothing. All jobs together stay well under GitHub's 10 GB per repository; a new
  # prefix-key starts them anew (the old entries expire unused after seven days).
  # (sccache on the GitHub Actions cache was tried: one cache entry per compiled crate, over 2000 entries, up to 400
  # write errors per job from the cache service's limits, 10-40 % hits, and in its first runs the jobs slower than with
  # target/ cached.
  # sccache on a bucket of its own (Cloudflare R2) would avoid the limits; the next step if this is not enough.)
  # Incremental compilation is not worth caching in CI and makes target/ larger.
  CARGO_INCREMENTAL: '0'
  # cargo-nextest (.config/nextest.toml): the scenario tests, each test a process of its own, many at once
  NEXTEST_PROFILE: ci
  NEXTEST_VERSION: 0.9.148

jobs:
  changes:
    name: Which parts changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      core: ${{ steps.find.outputs.core }}
      web: ${{ steps.find.outputs.web }}
      connector: ${{ steps.find.outputs.connector }}
      hub: ${{ steps.find.outputs.hub }}
      version: ${{ steps.find.outputs.version }}
      release: ${{ steps.inputs.outputs.release }}
      parts: ${{ steps.inputs.outputs.parts }}
      reuse: ${{ steps.inputs.outputs.reuse }}
      since: ${{ steps.inputs.outputs.since }}
      changed_web: ${{ steps.inputs.outputs.web }}
      changed_connector: ${{ steps.inputs.outputs.connector }}
      changed_hub: ${{ steps.inputs.outputs.hub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Main only: what each part is built from, against the manifest of the newest release v<N> (its signature
      # checked first). A part whose hash differs changed; one changed part makes a release. The newest release
      # cannot be read or checked: nothing is taken from it, every part counts as changed.
      - name: What changed since the newest release
        id: inputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh .github/scripts/inputs.sh > "$RUNNER_TEMP/inputs"
          cat "$RUNNER_TEMP/inputs"
          old=$RUNNER_TEMP/newest
          mkdir "$old"
          if ! newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | sed -n 's/^v\([1-9][0-9]*\)$/\1/p' | sort -n | tail -n 1); then
            echo "::warning::the releases could not be listed: every part is built"
            newest=
          elif [ -z "$newest" ]; then
            echo "no release v<N> yet: every part counts as changed"
          elif gh release download "v$newest" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --pattern manifest.json.sig --dir "$old" \
            && sh release/sign.sh verify "$old/manifest.json" \
            && jq -e --arg r "$GITHUB_REPOSITORY" --arg t "v$newest" '.product == "trommi" and .repository == $r and .tag == $t' "$old/manifest.json" > /dev/null; then
            echo "compared with v$newest"
          else
            echo "::warning::the manifest of v$newest could not be read or is not that release of this repository, signed: every part is built"
            newest=
          fi
          [ -n "$newest" ] || echo '{}' > "$old/manifest.json"
          # the release the unchanged parts are taken from
          echo "reuse=${newest:+v$newest}" >> "$GITHUB_OUTPUT"
          # the commit that release was built from: on main every check compares with it, not with the commit before,
          # so what a failed main build left untested is tested again (empty: every part counts as changed)
          since=$(jq -r '.commit // ""' "$old/manifest.json")
          printf '%s' "$since" | grep -Eq '^[0-9a-f]{40}$' || since=
          echo "since=$since" >> "$GITHUB_OUTPUT"
          any=false
          : > "$RUNNER_TEMP/parts"
          while read -r part sum; do
            before=$(jq -r --arg p "$part" '.inputs[$p] // ""' "$old/manifest.json")
            if [ "$sum" = "$before" ]; then changed=false; else changed=true; any=true; fi
            echo "$part $sum $changed" >> "$RUNNER_TEMP/parts"
            echo "$part=$changed" >> "$GITHUB_OUTPUT"
            echo "- $part: $([ "$changed" = true ] && echo changed || echo unchanged) since ${newest:+v$newest}${newest:-nothing}" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/inputs"
          # hub or its updater: one delivery to the server
          if grep -Eq '^(hub|updater) [0-9a-f]+ true$' "$RUNNER_TEMP/parts"; then echo "hub=true" >> "$GITHUB_OUTPUT"; else echo "hub=false" >> "$GITHUB_OUTPUT"; fi
          echo "release=$any" >> "$GITHUB_OUTPUT"
          { echo "parts<<PARTS_END"; cat "$RUNNER_TEMP/parts"; echo "PARTS_END"; } >> "$GITHUB_OUTPUT"
          echo "- release: $any" >> "$GITHUB_STEP_SUMMARY"
      - name: Find the changed parts
        id: find
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
          SINCE: ${{ steps.inputs.outputs.since }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          echo "version=$((RUN_NUMBER + RELEASE_BASE))" >> "$GITHUB_OUTPUT"
          base=
          case "$EVENT" in
            # main: since the newest release, as the parts' inputs above; a main build that failed or was cancelled
            # leaves its changes in that range, so the next one runs their checks again (not only the last push's)
            push) if [ "$MAIN" = true ]; then base=$SINCE; else base=$BEFORE; fi ;;
            pull_request) base=$(git merge-base "$PR_BASE" HEAD || true) ;;
          esac
          # no known commit to compare with (a run by hand, a first push, a rewritten branch): everything changed
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            all=0
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/files"
            echo "compared with $base: $(wc -l < "$RUNNER_TEMP/files") file(s) changed"
          else
            all=1
            : > "$RUNNER_TEMP/files"
            echo "nothing to compare with: every part counts as changed"
          fi
          shared='core/|client/|Cargo\.toml$|\.config/nextest\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/build\.yml$'
          # part <job> '<its own paths>' [<its parts in the release>]: the job runs when its paths changed since the commit
          # compared with (main: the newest release's), and (main) when the inputs of one of its parts differ from the
          # newest release's, to build them
          part() {
            if [ "$all" = 1 ] || grep -Eq "^($2|$shared)" "$RUNNER_TEMP/files"; then value=true; else value=false; fi
            if [ -n "${3:-}" ] && grep -Eqs "^($3) [0-9a-f]{64} true$" "$RUNNER_TEMP/parts"; then value=true; fi
            echo "$1=$value" >> "$GITHUB_OUTPUT"
            echo "$1: $value"
            echo "- $1: $value" >> "$GITHUB_STEP_SUMMARY"
          }
          # (connector/tools.json and prompt.md, demo/: the app's build reads them)
          # the core itself: its sources (core/ is in `shared`), its tests, the test library, the vectors
          part core 'tests/core/|tests/src/|tests/bindings/|tests/Cargo\.toml$|spec/vectors/|spec/account-vectors\.json$|THIRD-PARTY\.md$|\.github/scripts/third_party\.mjs$'
          part web 'app/web/|tests/web/|connector/tools\.json$|connector/prompt\.md$|demo/|\.node-version$|\.github/scripts/web_release\.mjs$|\.github/scripts/release_notes\.mjs$|\.github/tools/wrangler/|\.github/workflows/deploy_web\.yml$' web
          part connector 'connector/|release/|install\.sh$|\.claude-plugin/|tests/connector/|tests/Cargo\.toml$|\.github/workflows/release\.yml$' connector
          part hub 'hub/|release/|tests/hub/|tests/deploy/|tests/Cargo\.toml$|\.github/workflows/deploy_hub\.yml$|\.github/scripts/hub_compat\.sh$' 'hub|updater'

  # The shared core's own tests: the crates' unit tests and the scenario tests under tests/core and tests/bindings.
  # Every other part builds on the core, and none of their jobs runs these. It builds and delivers nothing.
  core:
    name: Core (check)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (only the targets and components this job needs: .github/scripts/rust_toolchain.sh)
      - name: Compiler (rust-toolchain.toml), clippy
        run: sh .github/scripts/rust_toolchain.sh --component clippy
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-nextest, the prebuilt binary of the pinned version (its checksum checked by the action)
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Clippy
        run: cargo clippy --locked -p trommi-core -p trommi-client-core -p trommi-core-wasm -p trommi-core-swift --all-targets -- -D warnings
      # the licence tables are what cargo reports for this Cargo.lock (.github/scripts/third_party.mjs)
      - name: THIRD-PARTY.md is current
        run: node .github/scripts/third_party.mjs --check
      - name: The crates' own tests
        run: cargo test --locked -p trommi-core -p trommi-client-core -p trommi-core-wasm -p trommi-core-swift
      # One test that fails must not hide the others: every target runs, the step fails at the end.
      - name: The scenario tests (tests/core, tests/bindings) and the test library
        run: |
          set -eu
          tests=$(sed -n 's/^name = "\(\(core\|bindings\)_[a-z0-9_]*\)"$/--test \1/p' tests/Cargo.toml | tr '\n' ' ')
          [ -n "$tests" ] || { echo "::error::tests/Cargo.toml names no core test"; exit 1; }
          # shellcheck disable=SC2086
          cargo nextest run --locked -p trommi-tests --no-fail-fast --lib $tests

  web:
    name: Web app (check)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The hub the app speaks to. The build is checked against it: the page's policy must name this hub and no other.
      WEB_HUB_URL: https://hub.trommi.com
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Compiler (rust-toolchain.toml)
        run: |
          set -eu
          sh .github/scripts/rust_toolchain.sh wasm32-unknown-unknown
          echo "WASM_BINDGEN=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' core/wasm/Cargo.toml)" >> "$GITHUB_ENV"
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ env.WASM_BINDGEN }}-${{ hashFiles('rust-toolchain.toml') }}
      # the command must be the version of the crate in Cargo.lock (core/wasm/build.sh checks it)
      - name: wasm-bindgen
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
      - name: Packages
        working-directory: app/web
        run: npm ci --no-audit --no-fund
      - name: The Rust core for the browser
        run: sh core/wasm/build.sh
      - name: Test
        working-directory: app/web
        run: npm test
      # The build: on a pull request as a check; on main the build of the release, only when the web's inputs differ
      # from the newest release's (otherwise release.yml takes web.tar.gz from that release).
      - name: Build
        if: needs.changes.outputs.changed_web != 'false'
        run: node app/web/dev/build.mjs --write
      # What is delivered (main only): the files, the worker, its settings, and the manifest that names every file.
      - name: Put the release together
        if: github.event_name != 'pull_request' && needs.changes.outputs.changed_web != 'false'
        run: |
          set -eu
          node .github/scripts/web_release.mjs app/web/public out
          (cd out && sha256sum -c --quiet checksums.txt)
          # the settings are tried as wrangler reads them; nothing is sent
          npm ci --no-audit --no-fund --ignore-scripts --prefix .github/tools/wrangler
          (cd out && WRANGLER_SEND_METRICS=false ../.github/tools/wrangler/node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry")
          {
            echo "### Web app, build $VERSION"
            echo
            echo "hub \`$WEB_HUB_URL\`, $(jq '.files | length' out/manifest.json) files, manifest \`$(sha256sum out/manifest.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && needs.changes.outputs.changed_web != 'false'
        with:
          name: web-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  deploy_web:
    name: Web app
    needs: [changes, web, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true' && needs.changes.outputs.changed_web == 'true' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      # deploy_web.yml's job report opens or closes the issue of a failed delivery
      issues: write
    uses: ./.github/workflows/deploy_web.yml
    with:
      version: ${{ needs.changes.outputs.version }}
      commit: ${{ github.sha }}
      artifact: web-release
    secrets: inherit

  connector:
    name: Connector (check)
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Compiler (rust-toolchain.toml), clippy
        run: sh .github/scripts/rust_toolchain.sh --component clippy
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-nextest, the prebuilt binary of the pinned version (its checksum checked by the action)
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Clippy
        run: cargo clippy --locked -p trommi-connector --all-targets -- -D warnings
      # The scenario tests start the hub of this repository and the built connector (tests/connector/common/mod.rs).
      - name: Test
        run: |
          set -eu
          cargo build --locked -p trommi-hub -p trommi-connector
          tests=$(sed -n 's/^name = "\(connector_[a-z0-9_]*\)"$/--test \1/p' tests/Cargo.toml | tr '\n' ' ')
          [ -n "$tests" ] || { echo "::error::tests/Cargo.toml names no connector test"; exit 1; }
          # shellcheck disable=SC2086
          # TROMMI_HUB_SERVES_REMOVAL: this repository's hub has the removal route, so a removed connector must verify
          # its removal there (without it the test accepts a connector that only keeps its state)
          TROMMI_HUB_SERVES_REMOVAL=1 TROMMI_HUB_BIN="$PWD/target/debug/trommi-hub" cargo nextest run --locked -p trommi-tests --no-fail-fast $tests

  # Main only, and only when the connector's inputs differ from the newest release's (otherwise release.yml takes the
  # binaries from it): the four release binaries, as connector/build-plugin.mjs makes them, one machine per target at
  # the same time (one after another they took 11-12 minutes) and beside the job connector's tests. The job
  # connector_release puts them together.
  connector_build:
    name: Connector build (${{ matrix.target }})
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.connector == 'true' && needs.changes.outputs.changed_connector != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # one target that does not build stops the others: there is no release without all four
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      TARGET: ${{ matrix.target }}
      # what the macOS binaries are linked with (connector/build-plugin.mjs): zig, by its published SHA-256, and
      # cargo-zigbuild
      ZIG_VERSION: 0.14.1
      ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
      ZIGBUILD_VERSION: 0.23.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # clang compiles ring's C for the Linux targets; zig links the macOS ones
      - name: Compiler (rust-toolchain.toml), clang, zig
        run: |
          set -eu
          sh .github/scripts/rust_toolchain.sh "$TARGET"
          clang --version | head -n 1
          case "$TARGET" in *-apple-darwin) ;; *) exit 0 ;; esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components 1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/zig/zig" version
      # the downloaded and compiled crates of this target (see env above); only main runs this job
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: zigbuild
        if: endsWith(matrix.target, '-apple-darwin')
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}-${{ env.ZIGBUILD_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: cargo-zigbuild
        if: endsWith(matrix.target, '-apple-darwin') && steps.zigbuild.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --version "$ZIGBUILD_VERSION" --locked
      # A target that did not build is an error here, not a smaller release.
      - name: Build
        run: |
          set -eu
          # the release number is compiled in: a connector refuses a release older than itself (update.rs)
          TROMMI_RELEASE_VERSION="$VERSION" node connector/build-plugin.mjs "$RUNNER_TEMP/dist" --targets "$TARGET"
          [ -f "$RUNNER_TEMP/dist/trommi-connector-$TARGET" ] || { echo "::error::no build for $TARGET"; exit 1; }
          mkdir out
          cp "$RUNNER_TEMP/dist/trommi-connector-$TARGET" out/
          file "out/trommi-connector-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-build-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  # The connector's release: the four binaries of connector_build and the manifest that names them (the plugin for
  # Claude Code is no release file: it is the folder connector/plugin, which names the installed connector).
  connector_release:
    name: Connector release
    needs: [changes, connector_build]
    if: github.event_name != 'pull_request' && needs.changes.outputs.connector == 'true' && needs.changes.outputs.changed_connector != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: connector-build-*
          merge-multiple: true
          path: out/
      - name: Put the release together
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "out/trommi-connector-$target" ] || { echo "::error::no build for $target"; exit 1; }
            # an artifact does not keep the executable bit
            chmod 755 "out/trommi-connector-$target"
            file "out/trommi-connector-$target"
          done
          [ "$(find out -type f | wc -l)" = 4 ] || { echo "::error::out/ holds more than the four binaries"; ls -la out; exit 1; }
          for f in out/trommi-connector-*-linux-musl; do
            file "$f" | grep -Eq 'static(ally|-pie) linked' || { echo "::error::$f is not a static binary"; exit 1; }
          done
          release/manifest.sh trommi-connector "$VERSION" "$GITHUB_SHA" out/* > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" out/manifest.json
          release/sign.sh files out/manifest.json
          cat out/manifest.json
      # The very file that will be released is started once.
      - name: Try the built connector
        run: out/trommi-connector-x86_64-unknown-linux-musl --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  hub:
    name: Hub (check)
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # and, for the release build (main), the static target and the C compiler for it, fetched beside the compiler
      - name: Compiler (rust-toolchain.toml), clippy, the C compiler for static builds
        env:
          STATIC: ${{ github.event_name != 'pull_request' && needs.changes.outputs.changed_hub != 'false' }}
        run: |
          set -eu
          if [ "$STATIC" = true ]; then
            { sudo apt-get update -q && sudo apt-get install -y -q musl-tools; } > "$RUNNER_TEMP/apt.log" 2>&1 &
            apt=$!
            sh .github/scripts/rust_toolchain.sh --component clippy "$TARGET"
            wait "$apt" || { cat "$RUNNER_TEMP/apt.log"; echo "::error::musl-tools could not be installed"; exit 1; }
            tail -n 3 "$RUNNER_TEMP/apt.log"
          else
            sh .github/scripts/rust_toolchain.sh --component clippy
          fi
      # the downloaded crates (~/.cargo) and the compiled ones (target/), one cache per job, saved by main; a pull
      # request reads main's (see env above)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-nextest, the prebuilt binary of the pinned version (its checksum checked by the action)
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Clippy
        run: cargo clippy --locked -p trommi-hub -p trommi-hub-updater --all-targets -- -D warnings
      # the hub's tests and the deploy path's (updater, release form, settings)
      - name: Test
        run: |
          set -eu
          tests=$(sed -n 's/^name = "\(\(hub\|deploy\)_[a-z0-9_]*\)"$/--test \1/p' tests/Cargo.toml | tr '\n' ' ')
          [ -n "$tests" ] || { echo "::error::tests/Cargo.toml names no hub test"; exit 1; }
          # shellcheck disable=SC2086
          cargo nextest run --locked -p trommi-tests --no-fail-fast $tests
      - name: Scripts of the deploy path
        run: |
          set -eu
          # notes of the lowest level differ between shellcheck versions and do not stop the build
          shellcheck -S warning release/*.sh hub/deploy/*.sh
          bash hub/deploy/install.sh check
      # The files of the release: both programs as static binaries and the manifest that
      # names them. The commit is compiled in; paths of the build machine are not. Main only, and only when the inputs
      # of the hub or its updater differ from the newest release's; release.yml takes the program whose inputs did not
      # change from that release.
      - name: Build the release
        if: github.event_name != 'pull_request' && needs.changes.outputs.changed_hub != 'false'
        env:
          TROMMI_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked --target "$TARGET" -p trommi-hub -p trommi-hub-updater
          mkdir out
          cp "target/$TARGET/release/trommi-hub" "out/trommi-hub-$TARGET"
          cp "target/$TARGET/release/trommi-hub-updater" "out/trommi-hub-updater-$TARGET"
          for f in "out/trommi-hub-$TARGET" "out/trommi-hub-updater-$TARGET"; do
            file "$f" | grep -Eq 'static(ally|-pie) linked' || { echo "::error::$f is not a static binary"; exit 1; }
          done
          DATA_EPOCH=$(tr -d ' \n' < hub/data-epoch) release/manifest.sh trommi-hub "$VERSION" "$GITHUB_SHA" out/* > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" out/manifest.json
          release/sign.sh files out/manifest.json
          cat out/manifest.json
      # The very file that will be released is started once and asked whether it is well and which commit it is.
      - name: Try the built hub
        if: github.event_name != 'pull_request' && needs.changes.outputs.changed_hub != 'false'
        run: |
          set -eu
          data=$(mktemp -d)
          HUB_HOST=127.0.0.1 HUB_PORT=18790 HUB_DATA="$data" HUB_QUIET=1 "out/trommi-hub-$TARGET" &
          pid=$!
          got=
          for _ in $(seq 1 20); do
            if got=$(curl -fsS --max-time 2 http://127.0.0.1:18790/healthz); then break; fi
            sleep 0.5
          done
          kill "$pid" || true
          [ -n "$got" ] || { echo "::error::the built hub did not answer"; exit 1; }
          echo "$got"
          [ "$(printf '%s' "$got" | jq -r .commit)" = "$GITHUB_SHA" ] || { echo "::error::the built hub does not report this commit"; exit 1; }
      # Expand, then contract (hub/deploy/README.md, "Migrations"): the hub of the newest release must still start
      # and answer on a database this build's hub has migrated, so that putting the program back after a failed
      # deploy is always safe. A build that raises hub/data-epoch declares that it is not; the check is then skipped
      # and the updater never puts the program back past it once the new hub has served.
      - name: The hub before runs on data this one migrated
        if: github.event_name != 'pull_request' && needs.changes.outputs.changed_hub != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/hub_compat.sh "out/trommi-hub-$TARGET" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && needs.changes.outputs.changed_hub != 'false'
        with:
          name: hub-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  # The one release of this run: every part's files and one signed manifest (release.yml): the parts built here, the
  # unchanged ones taken from the newest release. Only on main, only when the inputs of a part changed since the
  # newest release, and only when every part that ran passed.
  release:
    name: Release
    needs: [changes, core, web, connector, connector_build, connector_release, hub]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.outputs.release == 'true'
      && contains(fromJSON('["success","skipped"]'), needs.web.result)
      && contains(fromJSON('["success","skipped"]'), needs.connector.result)
      && contains(fromJSON('["success","skipped"]'), needs.connector_build.result)
      && contains(fromJSON('["success","skipped"]'), needs.connector_release.result)
      && contains(fromJSON('["success","skipped"]'), needs.hub.result)
      && contains(fromJSON('["success","skipped"]'), needs.core.result) }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.changes.outputs.version }}
      commit: ${{ github.sha }}
      parts: ${{ needs.changes.outputs.parts }}
      reuse: ${{ needs.changes.outputs.reuse }}
    secrets: inherit

  # The server fetches the release itself; it restarts the hub only when the hub's inputs differ from those of the
  # release it runs (hub/updater).
  deploy_hub:
    name: Hub
    needs: [changes, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true' && needs.changes.outputs.changed_hub == 'true' }}
    permissions:
      id-token: write
      # deploy_hub.yml's job report opens or closes the issue of a failed delivery
      contents: read
      issues: write
    uses: ./.github/workflows/deploy_hub.yml
    with:
      tag: v${{ needs.changes.outputs.version }}
    secrets: inherit

  # A run on main: when a part's job or the release failed, open the issue "Main build v<N> failed" (label build-failed)
  # or comment on the open one; when all passed, close it. A failed delivery has its own issue (deploy_*.yml).
  report:
    name: Report
    needs: [changes, core, web, connector, connector_build, connector_release, hub, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.changes.outputs.version }}
      WHAT: build
      RUNNING: the commit built, ${{ github.sha }}
      LABEL: build-failed
      RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: |
          set -eu
          # the jobs that failed, by their names in this file
          REASON="failed: $(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')"
          export REASON
          sh .github/scripts/deploy_issue.sh Main
