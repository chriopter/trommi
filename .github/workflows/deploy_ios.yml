# Delivers the iOS app to TestFlight: every build to the internal group "Intern"; a build of main also to the external
# group "Public", whose public link is the rolling beta for everyone, and to Beta App Review when Apple asks for it
# (the first build of a new version; later builds of a reviewed version usually go without). The App Store gets
# reviewed versions less often, by hand (release_ios.yml).
#
# build.yml calls it on main (with a release) and on staging (without one).
# Interface (build.yml calls it; see the head of build.yml):
#   version   the release number of the build run (shown in the run only; the build number is App Store Connect's
#             highest plus one, so it rises whatever was shipped from elsewhere)
#   commit    the commit that was built
#   artifact  the artifact of that run: the Rust core for iOS as build.yml built and tested it
#             (lib/ios/libtrommi_core_ffi.a, UniFFI's TrommiCoreFFI.h and TrommiCoreRust.swift, checksums.txt)
#   gate      "release" (main): upload only once this run's release is published and verified; empty: no wait
# By hand (Actions -> deploy_ios -> Run workflow): `run_id`, the id of a build run whose iOS build is delivered
# (again: App Store Connect then gets a new build number for the same commit); `dry_run`: everything up to the signed,
# checked .ipa and the upload's checks, offline; nothing is uploaded (App Store Connect only renews profiles).
#
# What is carried over from the build is the Rust core. The app itself is archived here: Apple's signing happens
# in the archive and export steps and needs the App Store Connect key, which only this workflow sees. The steps are
# .github/scripts/ios_testflight.sh: the Mac (job testflight) archives, exports one signed .ipa, checks it and uploads
# that file through the App Store Connect API. On main (gate: release) build.yml starts this workflow while the release
# of the same run is still being made; only the upload waits for it (ios_release_gate.sh: published, signature,
# commit, iOS inputs), so only a released app ships. Waiting for App Store Connect
# to process the build, the groups, What to Test and Beta App Review run on Linux (job processed), so the Mac is free
# minutes earlier. Main's What to Test is the newest day of CHANGELOG.md. The group "Public" is made once by hand
# (app/ios/README.md "Public beta"); while it is missing, main's delivery fails saying so.
# The workflow's concurrency holds both jobs: the next delivery reads the highest build number only once this one's
# build is processed and listed.
#
# Secrets: the environment `ios` holds OP_SERVICE_ACCOUNT_TOKEN and OP_ENVIRONMENT_ID; APPLE_ASC_KEY,
# APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER_ID and APPLE_TEAM_ID come from the 1Password Environment, and for main's
# Beta App Review APPSTORE_DEMO_PASSWORD (the password of the demo account in review_information). Optional repository
# variables: IOS_NON_EXEMPT_ENCRYPTION (YES or NO, default NO: standard algorithms only,
# so exempt; app/ios/README.md "Export compliance"), IOS_EXPORT_COMPLIANCE_CODE (only with YES: the code of the app's
# export compliance documentation, written into Info.plist as ITSEncryptionExportComplianceCode; left empty, the code
# of the APPROVED documentation is read from App Store Connect), IOS_TESTFLIGHT_TESTER (an address kept in the group),
# IOS_UPLOADER (xcode: the fallback, a second Xcode export with destination upload instead of the API).
name: deploy_ios

on:
  workflow_call:
    inputs:
      version:
        description: The release number of the build run
        required: true
        type: string
      commit:
        description: The commit that was built
        required: true
        type: string
      artifact:
        description: The artifact of this run that holds the Rust core for iOS
        required: true
        type: string
      gate:
        description: release (main) = upload only once this run's release is published and verified; empty = no wait
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of a build run whose iOS build is delivered
        required: true
        type: string
      dry_run:
        description: Sign and check only; upload nothing
        required: false
        type: boolean
        default: false

permissions: {}

# one delivery at a time (each takes the next build number); a waiting one is not cut off
concurrency:
  group: deploy_ios
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight
    # macOS with Xcode 27 (the app's deployment target is iOS 27)
    runs-on: xcode-27
    timeout-minutes: 90
    environment:
      name: ios
      url: https://appstoreconnect.apple.com/apps
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.core.outputs.commit }}
      version: ${{ steps.upload.outputs.version }}
      build: ${{ steps.upload.outputs.build }}
      channel: ${{ steps.upload.outputs.channel }}
    env:
      # XcodeGen, by the SHA-256 of its release archive
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      # A run named by hand must be a build of the main or staging branch of this repository: a pull request's run also has
      # artifacts, and nothing of such a run may be signed, attested or delivered.
      - name: The run that is delivered again
        id: source
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          printf '%s' "$RUN_ID" | grep -Eq '^[1-9][0-9]{0,19}$' || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg r "$GITHUB_REPOSITORY" \
            '.path == ".github/workflows/build.yml" and (.head_branch == "main" or .head_branch == "staging") and (.event == "push" or .event == "workflow_dispatch") and .repository.full_name == $r and .head_repository.full_name == $r' \
            "$RUNNER_TEMP/run.json" > /dev/null || { echo "::error::run $RUN_ID is not a build of the main or staging branch of this repository"; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion == "success") | .name' > "$RUNNER_TEMP/jobs.txt"
          grep -Fq "iOS (test and build the core)" "$RUNNER_TEMP/jobs.txt" || { echo "::error::the job iOS (test and build the core) of run $RUN_ID did not succeed"; exit 1; }
          echo "commit=$(jq -r .head_sha "$RUNNER_TEMP/run.json")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .head_branch "$RUNNER_TEMP/run.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact || 'ios-release' }}
          path: ${{ runner.temp }}/core
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Which commit the core was built from
        id: core
        env:
          COMMIT: ${{ inputs.commit || steps.source.outputs.commit }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/core"
          shasum -a 256 -c checksums.txt
          commit=$(sed -n 's/^commit: //p' build.txt)
          printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::the artifact names no commit"; exit 1; }
          [ "$commit" = "$COMMIT" ] || { echo "::error::the core is of $commit, the run built $COMMIT"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.core.outputs.commit }}
          persist-credentials: false
      # the tested library and its bindings go where core/swift/build.sh would have written them
      - name: Put the Rust core in place
        run: |
          set -eu
          package=core/swift/TrommiCoreRust
          mkdir -p "$package/lib/ios" "$package/Sources/TrommiCoreFFI/include"
          cp "$RUNNER_TEMP/core/lib/ios/libtrommi_core_ffi.a" "$package/lib/ios/"
          cp "$RUNNER_TEMP/core/Sources/TrommiCoreFFI/include/TrommiCoreFFI.h" "$package/Sources/TrommiCoreFFI/include/"
          cp "$RUNNER_TEMP/core/Sources/TrommiCoreRust/TrommiCoreRust.swift" "$package/Sources/TrommiCoreRust/"
      - name: XcodeGen
        run: |
          set -eu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "XCODEGEN=$RUNNER_TEMP/xcodegen/bin/xcodegen" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      - name: Install the 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: latest-beta
      - name: Build, sign, upload
        id: upload
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
          COMMIT: ${{ steps.core.outputs.commit }}
          ITS_NON_EXEMPT_ENCRYPTION: ${{ vars.IOS_NON_EXEMPT_ENCRYPTION || 'NO' }}
          ITS_EXPORT_COMPLIANCE_CODE: ${{ vars.IOS_EXPORT_COMPLIANCE_CODE }}
          TF_GATE: ${{ inputs.gate }}
          TF_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # main (by build.yml with the release gate, or by hand from a run of main): the public beta as well
          TF_CHANNEL: ${{ (inputs.gate == 'release' || steps.source.outputs.branch == 'main') && 'public' || '' }}
          TF_UPLOADER: ${{ vars.IOS_UPLOADER || 'api' }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          VERSION_RELEASE: ${{ inputs.version }}
        run: |
          set -eu
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "::error::OP_SERVICE_ACCOUNT_TOKEN is not set for this run"; exit 1; }
          test -n "$OP_ENVIRONMENT_ID" || { echo "::error::OP_ENVIRONMENT_ID is not set for this run"; exit 1; }
          op run --environment "$OP_ENVIRONMENT_ID" -- bash .github/scripts/ios_testflight.sh upload
          echo "channel=$TF_CHANNEL" >> "$GITHUB_OUTPUT"
      - name: No key file is left
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ExportOptions.plist"

  # App Store Connect processes the uploaded build (minutes); then the group "Intern" holds it and What to Test is set;
  # a build of main also goes to the group "Public" and, when Apple asks for it, to Beta App Review.
  processed:
    name: TestFlight (processed, groups, What to Test, review)
    needs: testflight
    # nothing was uploaded in a dry run
    if: needs.testflight.outputs.build != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: ios
      url: https://appstoreconnect.apple.com/apps
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.testflight.outputs.commit }}
          persist-credentials: false
      - name: Install the 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: latest-beta
      - name: Wait until processed, hand to the group
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
          COMMIT: ${{ needs.testflight.outputs.commit }}
          TF_VERSION: ${{ needs.testflight.outputs.version }}
          TF_BUILD: ${{ needs.testflight.outputs.build }}
          TESTFLIGHT_TESTER: ${{ vars.IOS_TESTFLIGHT_TESTER }}
          TF_CHANNEL: ${{ needs.testflight.outputs.channel }}
        run: |
          set -eu
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "::error::OP_SERVICE_ACCOUNT_TOKEN is not set for this run"; exit 1; }
          test -n "$OP_ENVIRONMENT_ID" || { echo "::error::OP_ENVIRONMENT_ID is not set for this run"; exit 1; }
          op run --environment "$OP_ENVIRONMENT_ID" -- bash .github/scripts/ios_testflight.sh after
      - name: No key file is left
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
