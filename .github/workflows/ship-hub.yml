# The hub and its updater (hub/), from a push to main to the hub's server, on their own: they wait for no other part.
#
#   decide   whether the hub must be delivered: what the server has (GitHub's record of the newest delivery that went
#            through, and what hub.trommi.com runs) was built from other inputs than this commit's
#            (.github/scripts/deployed.sh; a delivery that failed is made again by the next run); the number N (this
#            workflow's run number plus RELEASE_BASE)
#   checks   the hub's checks and, when the core changed, the core's, every test (.github/actions/check-*)
#   build    beside the checks: both programs as static binaries and the manifest that names them; the very file is
#            started once; every hub the updater may put back must run on data this one migrated
#            (.github/scripts/hub_compat.sh)
#   release  hub-v<N> (sign-release.yml): signed, attested, never latest
#   deliver  joins the tailnet and tells the server which release to take; shows the server's answer; then asks the
#            hub from outside (https://hub.trommi.com/healthz) until it answers as the commit the server reported, well
#   report   when deliver failed: opens the issue "Hub update hub-v<N> failed" (label deploy-failed) with the reason, the
#            run and what runs now, or comments on the one that is open; when it went through: closes that issue
#
# The server takes no code from here. The call names a release; the server fetches it from GitHub itself, checks the
# signature against the public key pinned on it, and restarts the hub only when the hub's inputs differ from those of
# the release it runs (otherwise it notes the release and the hub keeps running); a new hub is checked for health and
# rolled back when it is not well; before the swap it is tried on a copy of the data (a dry run), and a release that
# fails that never touches what runs (hub/deploy/README.md). This run fails when the server says the release does not
# run, or that its updater was not taken.
# By hand (Actions -> ship-hub -> Run workflow, on main): `tag`, a published release (hub-v<N>), delivered again.
#
# Secrets: the environment `hub` (branch main only) holds TAILSCALE_OAUTH_CLIENT_ID and TAILSCALE_AUDIENCE; the signing
# job of sign-release.yml (environment `connector`) the release key.
name: ship-hub

on:
  push:
    branches: [main]
    paths:
      - hub/**
      - release/**
      - tests/hub/**
      - tests/deploy/**
      - tests/src/**
      - tests/Cargo.toml
      - core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/scripts/hub_compat.sh
      - .github/scripts/deployed.sh
      - .github/scripts/inputs.sh
      - .github/scripts/release_notes.mjs
      - .github/workflows/ship-hub.yml
      - .github/actions/**
      - .github/scripts/changed_parts.sh
      - .github/scripts/source_tree.sh
      - .github/workflows/pr-check.yml
      - .github/workflows/sign-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: A published release to deliver again, e.g. hub-v1012 (or an older v375)
        required: true
        type: string

permissions: {}

# One run at a time; of the runs waiting only the newest (a started run, and so a delivery, is never cut off).
concurrency:
  group: ship-hub
  cancel-in-progress: false

env:
  # hub-v<N>: N is this workflow's run number plus this base, above every release the server accepted before the series
  # began (v375): it never takes one lower than it accepted
  RELEASE_BASE: 1000
  # the server's name on the tailnet and the port of its deploy endpoint
  HUB_SERVER: trommi-hub.tail276436.ts.net
  HUB_DEPLOY_PORT: "9443"

jobs:
  decide:
    name: Must it be delivered
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deliver: ${{ steps.decide.outputs.hub }}
      version: ${{ steps.decide.outputs.version }}
      parts: ${{ steps.decide.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: What the server has
        id: decide
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          echo "version=$((RUN_NUMBER + RELEASE_BASE))" >> "$GITHUB_OUTPUT"
          sh .github/scripts/inputs.sh > "$RUNNER_TEMP/inputs"
          sh .github/scripts/deployed.sh "$RUNNER_TEMP/inputs" hub | tee "$RUNNER_TEMP/deliver"
          cat "$RUNNER_TEMP/deliver" >> "$GITHUB_OUTPUT"
          flag=$(sed -n 's/^hub=//p' "$RUNNER_TEMP/deliver")
          { echo "parts<<PARTS_END"; sed -n "s/^\(\(hub\|updater\) [0-9a-f]\{64\}\)\$/\1 $flag/p" "$RUNNER_TEMP/inputs"; echo "PARTS_END"; } >> "$GITHUB_OUTPUT"

  # Which parts changed (since this workflow's newest green run on main), the core's checks when it did, and the part's
  # own checks: the steps are the composite actions of .github/actions, the ones a pull request runs as well
  changed:
    name: Which parts changed
    needs: decide
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      core: ${{ steps.find.outputs.core }}
      part: ${{ steps.find.outputs.hub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the changed parts
        id: find
        env:
          EVENT: ${{ github.event_name }}
          PARTS: hub
          WORKFLOW: ship-hub.yml
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/changed_parts.sh

  core:
    name: Core (check)
    needs: changed
    if: needs.changed.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
      NEXTEST_VERSION: 0.9.148
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-core

  hub_check:
    name: Hub (check)
    needs: changed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
      NEXTEST_VERSION: 0.9.148
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-hub

  # The result of the checks, for the jobs that need them: the part's passed, the core's passed or was not asked for
  checks:
    name: Checks
    needs: [changed, core, hub_check]
    if: ${{ !cancelled() && needs.changed.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both passed
        env:
          PART: ${{ needs.hub_check.result }}
          CORE: ${{ needs.core.result }}
        run: |
          echo "Hub (check): $PART, Core (check): $CORE"
          [ "$PART" = success ] && { [ "$CORE" = success ] || [ "$CORE" = skipped ]; }

  build:
    name: Build
    needs: decide
    if: github.event_name == 'push' && needs.decide.outputs.deliver == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the static target, and the C compiler for it fetched beside the compiler
      - name: Compiler (rust-toolchain.toml), the C compiler for static builds
        run: |
          set -eu
          { sudo apt-get update -q && sudo apt-get install -y -q musl-tools; } > "$RUNNER_TEMP/apt.log" 2>&1 &
          apt=$!
          sh .github/scripts/rust_toolchain.sh "$TARGET"
          wait "$apt" || { cat "$RUNNER_TEMP/apt.log"; echo "::error::musl-tools could not be installed"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/apt.log"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The files of the release: both programs as static binaries and the manifest that
      # names them. The commit is compiled in; paths of the build machine are not.
      - name: Build the release
        env:
          TROMMI_COMMIT: ${{ github.sha }}
          ALL_PARTS: ${{ needs.decide.outputs.parts }}
        run: |
          set -eu
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --profile dist --locked --target "$TARGET" -p trommi-hub -p trommi-hub-updater
          mkdir out
          cp "target/$TARGET/dist/trommi-hub" "out/trommi-hub-$TARGET"
          cp "target/$TARGET/dist/trommi-hub-updater" "out/trommi-hub-updater-$TARGET"
          for f in "out/trommi-hub-$TARGET" "out/trommi-hub-updater-$TARGET"; do
            file "$f" | grep -Eq 'static(ally|-pie) linked' || { echo "::error::$f is not a static binary"; exit 1; }
          done
          # the inputs of the hub and of the updater: the server decides by them whether a program changed (hub/updater)
          PARTS=$(printf '%s\n' "$ALL_PARTS" | grep -E '^(hub|updater) [0-9a-f]{64} (true|false)$' || true)
          [ "$(printf '%s\n' "$PARTS" | grep -c .)" = 2 ] || { echo "::error::the inputs of the hub and the updater are not known"; exit 1; }
          PARTS="$PARTS" DATA_EPOCH=$(tr -d ' \n' < hub/data-epoch) release/manifest.sh trommi-hub "$VERSION" "$GITHUB_SHA" out/* > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" out/manifest.json
          release/sign.sh files out/manifest.json
          cat out/manifest.json
      # The very file that will be released is started once and asked whether it is well and which commit it is.
      - name: Try the built hub
        run: |
          set -eu
          data=$(mktemp -d)
          HUB_HOST=127.0.0.1 HUB_PORT=18790 HUB_DATA="$data" HUB_QUIET=1 "out/trommi-hub-$TARGET" &
          pid=$!
          got=
          for _ in $(seq 1 20); do
            if got=$(curl -fsS --max-time 2 http://127.0.0.1:18790/healthz); then break; fi
            sleep 0.5
          done
          kill "$pid" || true
          [ -n "$got" ] || { echo "::error::the built hub did not answer"; exit 1; }
          echo "$got"
          [ "$(printf '%s' "$got" | jq -r .commit)" = "$GITHUB_SHA" ] || { echo "::error::the built hub does not report this commit"; exit 1; }
      # Expand, then contract (hub/deploy/README.md, "Migrations"): the hub of the newest release must still start
      # and answer on a database this build's hub has migrated, so that putting the program back after a failed
      # deploy is always safe. A build that raises hub/data-epoch declares that it is not; the check is then skipped
      # and the updater never puts the program back past it once the new hub has served.
      - name: The hub before runs on data this one migrated
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/hub_compat.sh "out/trommi-hub-$TARGET" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  # The hub's signed release hub-v<N>, when its checks (and the core's, when it changed) and its build passed.
  release:
    name: Hub release
    needs: [decide, checks, build]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.decide.outputs.deliver == 'true'
      && needs.checks.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/sign-release.yml
    with:
      part: hub
      version: ${{ needs.decide.outputs.version }}
      commit: ${{ github.sha }}
      artifact: hub-release
    secrets: inherit

  deliver:
    name: Deliver to the server
    needs: release
    # a push: the hub's release went out; by hand: the release named
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.published == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: hub
      url: https://hub.trommi.com
    permissions:
      id-token: write
    outputs:
      reason: ${{ steps.tell.outputs.reason || steps.outside.outputs.reason }}
      running: ${{ steps.tell.outputs.running }}
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      - name: The release name
        run: |
          printf '%s' "$TAG" | grep -Eq '^(hub-)?v[1-9][0-9]{0,11}$' || { echo "::error::not a release: $TAG"; exit 1; }
      - name: Join the tailnet as the CI
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:trommi-ci
      - name: Tell the server
        id: tell
        run: |
          set -u
          url="http://$HUB_SERVER:$HUB_DEPLOY_PORT"
          # why this run failed, for the issue (job report): one line
          fail() {
            printf 'reason=%s\n' "$(printf '%s' "$1" | tr '\n' ' ' | cut -c1-900)" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          # Tried again: no connection (the server may be starting after a reboot) and "busy" (another deploy, or the
          # updater changing itself). Every other answer is final: a deploy that failed is not asked for twice.
          for try in 1 2 3 4 5 6 7 8 9; do
            status=0
            code=$(curl -sS --connect-timeout 10 --max-time 900 -o answer.json -w '%{http_code}' \
              -X POST -H 'content-type: application/json' --data "{\"tag\":\"$TAG\"}" "$url/deploy") || status=$?
            if [ "$status" = 6 ] || [ "$status" = 7 ]; then echo "no connection (try $try)"
            elif [ "$status" = 0 ] && [ "$code" = 503 ]; then echo "the server is busy (try $try)"
            else break
            fi
            sleep 20
          done
          if [ "$status" = 6 ] || [ "$status" = 7 ]; then
            {
              echo "### Hub: \`$TAG\` is published, NOT delivered"
              echo
              echo "Nothing answers on the server's deploy port. If the server has not had its first installation yet,"
              echo "that is expected: run \`hub/deploy/install.sh install $TAG\` on the owner's laptop."
              echo "Otherwise the server or its updater is down; once it is back, start this workflow by hand with \`$TAG\`."
            } >> "$GITHUB_STEP_SUMMARY"
            fail "$TAG is published but was not delivered: nothing answers on the server's deploy port (not set up yet, or down)"
          fi
          if [ "$status" != 0 ] || ! jq -e . answer.json > /dev/null 2>&1; then
            echo "### Hub: no usable answer from the server (curl exit $status, HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
            fail "no usable answer from the server's deploy endpoint (curl exit $status, HTTP $code); ask it: ssh root@$HUB_SERVER trommi-hub-updater status"
          fi
          printf 'running=%s\n' "$(jq -r '.running // ""' answer.json | tr -cd 'A-Za-z0-9-')" >> "$GITHUB_OUTPUT"
          {
            echo "### Hub deploy: $(jq -r .result answer.json)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| asked for | \`$TAG\` |"
            echo "| hub that runs now | \`$(jq -r '.running // "none"' answer.json)\` |"
            echo "| commit | \`$(jq -r '.commit // "?"' answer.json)\` |"
            echo "| SHA-256 of the hub | \`$(jq -r '.sha256 // "?"' answer.json)\` |"
            echo "| dry run on a copy of the data | $(jq -r 'if .dry_run then .dry_run.result + ": " + .dry_run.detail else "not run" end' answer.json) |"
            echo "| health | $(jq -r 'if .health then (if .health.ok then "well" else "NOT well: " + .health.detail end) + " after " + (.health.seconds | tostring) + " s" else "not asked" end' answer.json) |"
            echo "| put back | $(jq -r 'if .rollback_health then (if .rollback_health.ok then "the release before, and it is well" else "the release before, and it is NOT well: " + .rollback_health.detail end) else "no" end' answer.json) |"
            echo "| data | $(jq -r 'if .data then .data.result + ": " + .data.detail else "untouched" end' answer.json) |"
            echo "| updater that answered | \`$(jq -r '.updater.release // "?"' answer.json)\`$(jq -r 'if .updater.next then ", changing to `" + .updater.next + "`" else "" end' answer.json)$(jq -r 'if .updater.reverted then "; the updater of `" + .updater.reverted + "` did not come up" else "" end' answer.json) |"
            echo "| server says | $(jq -r .message answer.json) |"
          } >> "$GITHUB_STEP_SUMMARY"
          jq . answer.json
          # Refused because something newer already runs (a later build got there first): nothing to do, not a failure.
          running=$(jq -r '.running // ""' answer.json)
          if [ "$(jq -r .result answer.json)" = refused ] && [ "${running##*v}" -gt "${TAG##*v}" ] 2>/dev/null; then
            echo "::notice::$running already runs, which is newer than $TAG; nothing was changed"
            exit 0
          fi
          [ "$(jq -r .ok answer.json)" = true ] || fail "the server reports $(jq -r .result answer.json): $(jq -r .message answer.json)"
          # The hub went in, but the release's updater did not (hub/updater: the deploy stays ok and only says so): the
          # server keeps an updater older than the release it was told to take. That is a failed delivery too.
          if jq -r '.message // ""' answer.json | grep -q 'its updater was not taken'; then
            fail "$TAG: the hub runs, but its updater was not taken: $(jq -r .message answer.json)"
          fi
          jq -r '.commit // ""' answer.json > commit.txt

          # The updater replaces itself after it has answered. Wait until the new one answers, or the old one says
          # that the new one did not come up.
          next=$(jq -r '.updater.next // empty' answer.json)
          [ -n "$next" ] || exit 0
          for _ in $(seq 1 60); do
            sleep 5
            curl -sS --connect-timeout 5 --max-time 20 -o status.json "$url/status" 2>/dev/null || continue
            release=$(jq -r '.updater.release // empty' status.json 2>/dev/null) || continue
            reverted=$(jq -r '.updater.reverted // empty' status.json 2>/dev/null) || continue
            if [ "$reverted" = "$next" ]; then
              echo "The updater of \`$next\` did not come up; the one of \`$release\` runs again. The hub \`$TAG\` runs." >> "$GITHUB_STEP_SUMMARY"
              fail "the updater of $next did not come up; the server put its previous updater back (the hub $TAG runs)"
            fi
            if [ "$release" = "$next" ]; then
              echo "The updater of \`$next\` runs." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          fail "the server's updater did not answer as $next within five minutes"
      # What people reach: the hub behind the tunnel must answer as the commit the server reported, within minutes.
      - name: The hub from outside
        id: outside
        run: |
          set -u
          want=$(cat commit.txt 2>/dev/null || true)
          [ -n "$want" ] || exit 0
          got=''
          for _ in $(seq 1 36); do
            page=$(curl -fsS --max-time 10 https://hub.trommi.com/healthz 2>/dev/null) || page=''
            got=$(printf '%s' "$page" | jq -r '.commit // ""' 2>/dev/null) || got=''
            # well, serving, and naming its protocol version (what clients are checked against: 426 client-too-old)
            if [ "$got" = "$want" ] && printf '%s' "$page" | jq -e '.ok == true and (.protocol_version | type) == "number"' > /dev/null 2>&1; then
              echo "https://hub.trommi.com answers as $want, well, protocol $(printf '%s' "$page" | jq -r .protocol_version)"
              exit 0
            fi
            sleep 5
          done
          reason="https://hub.trommi.com/healthz does not answer as $want after three minutes (it answers as ${got:-nothing})"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          echo "::error::$reason"
          exit 1

  # One open issue per failing delivery, closed by the next one that goes through. Only this job may write issues.
  report:
    name: Report
    needs: [release, deliver]
    if: ${{ !cancelled() && (needs.deliver.result == 'failure' || needs.deliver.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
      RESULT: ${{ needs.deliver.result }}
      REASON: ${{ needs.deliver.outputs.reason }}
      RUNNING: ${{ needs.deliver.outputs.running }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEALTH_URL: https://hub.trommi.com/healthz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: sh .github/scripts/deploy_issue.sh Hub
