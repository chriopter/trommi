# Every night, the scale tests at full size. On pull requests and on main they run small (each test reads
# TROMMI_TESTS_FULL; without it the same steps at a fraction of the size), so that no check waits 2-3 minutes for one
# test. Here, with TROMMI_TESTS_FULL=1:
#   hub_limits               a_room_of_a_thousand_human_devices (1000 human devices, the founding above 1 MiB)
#   core_groups_concurrency  a_device_catches_up_across_twenty_groups_in_the_hubs_order_only (78 rounds)
#   connector_paths          helper_sessions_up_to_the_limit_then_close_one_to_open_another (100 helpers, the 101st)
#   connector_sessions       the whole session matrix (Claude Code and Codex, two accounts, folders, resume, restart,
#                            killed connector, stale key, self-join beside a link join); pull requests run its fast cases
# On the newest commit of main. When one fails, the job `report` opens the issue "Nightly full tests <commit> failed"
# (label nightly-failed) naming the tests that failed, or comments on the open one; the next night that passes
# closes it. It deploys nothing and reads no secret.
name: nightly

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  NEXTEST_PROFILE: ci
  NEXTEST_VERSION: 0.9.148

jobs:
  full:
    name: Scale tests at full size
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.test.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compiler (rust-toolchain.toml)
        run: sh .github/scripts/rust_toolchain.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # Every test runs (one failing does not hide the others); the names of those that failed go to the report.
      - name: Test
        id: test
        env:
          TROMMI_TESTS_FULL: '1'
        run: |
          set -uo pipefail
          cargo build --locked -p trommi-hub -p trommi-connector
          status=0
          TROMMI_HUB_SERVES_REMOVAL=1 TROMMI_HUB_BIN="$PWD/target/debug/trommi-hub" cargo nextest run --locked -p trommi-tests --no-fail-fast \
            --test hub_limits --test core_groups_concurrency --test connector_paths \
            -E 'test(=a_room_of_a_thousand_human_devices) | test(=a_device_catches_up_across_twenty_groups_in_the_hubs_order_only) | test(=helper_sessions_up_to_the_limit_then_close_one_to_open_another)' \
            2>&1 | tee "$RUNNER_TEMP/nextest.log" || status=$?
          # all three ran: a filter that matches fewer (a test renamed) is a failure too
          grep -Eq 'Starting 3 tests' "$RUNNER_TEMP/nextest.log" || { echo "::error::not the three full-size tests"; status=1; }
          # the session matrix, every case (tests/connector/sessions.rs)
          TROMMI_HUB_SERVES_REMOVAL=1 TROMMI_HUB_BIN="$PWD/target/debug/trommi-hub" cargo nextest run --locked -p trommi-tests --no-fail-fast \
            --test connector_sessions 2>&1 | tee -a "$RUNNER_TEMP/nextest.log" || status=$?
          failed=$(sed -n 's/^ *\(FAIL\|TIMEOUT\|SIGSEGV\|SIGABRT\) \[[^]]*\] ([^)]*) trommi-tests::\([a-z0-9_]*\) \([a-z0-9_:]*\)$/\2::\3/p' "$RUNNER_TEMP/nextest.log" | sort -u | tr '\n' ' ')
          [ "$status" = 0 ] || [ -n "$failed" ] || failed='the run did not finish (see the log)'
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit "$status"

  # One open issue while the nightly full tests fail, closed by the next night that passes.
  report:
    name: Report
    needs: full
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.full.result == 'failure' || needs.full.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.sha }}
      WHAT: full tests
      LABEL: nightly-failed
      RESULT: ${{ needs.full.result }}
      REASON: 'failed: ${{ needs.full.outputs.failed }}'
      RUNNING: main at ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: sh .github/scripts/deploy_issue.sh Nightly
