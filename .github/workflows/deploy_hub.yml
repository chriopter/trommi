# Delivers a published release to the hub's server. Called by build.yml after release.yml published v<N> and the
# inputs of the hub or its updater changed, or started by hand to deliver a published release once more.
#
#   deliver  joins the tailnet and tells the server which release to take; shows the server's answer; then asks the
#            hub from outside (https://hub.trommi.com/healthz) until it answers as the commit the server reported
#   report   when deliver failed: opens the issue "Hub update v<N> failed" (label deploy-failed) with the reason, the
#            run and what runs now, or comments on the one that is open; when it went through: closes that issue
#
# The server takes no code from here. The call names a release; the server fetches it from GitHub itself, checks
# the signature against the public key pinned on it, and restarts the hub only when the hub's inputs differ from
# those of the release it runs (otherwise it notes the release and the hub keeps running); a new hub is checked for
# health and rolled back when it is not well; before the swap it is tried on a copy of the data (a dry run), and a
# release that fails that never touches what runs (hub/deploy/README.md). It answers with what happened. This run fails when the server says the
# release does not run.
#
# Secrets: the environment `hub` (branch main only) holds TAILSCALE_OAUTH_CLIENT_ID and TAILSCALE_AUDIENCE.
#
# When nothing answers on the server's deploy port (before its first installation, or while it is down), `deliver`
# fails saying so: nothing was delivered.
name: deploy_hub

on:
  workflow_call:
    inputs:
      tag:
        description: The release, v<N>
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: A published release to deliver again, e.g. v123 (or an older hub-v123)
        required: true
        type: string

permissions: {}

env:
  # the server's name on the tailnet and the port of its deploy endpoint
  HUB_SERVER: trommi-hub.tail276436.ts.net
  HUB_DEPLOY_PORT: "9443"

jobs:
  deliver:
    name: Deliver to the server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: hub
      url: https://hub.trommi.com
    permissions:
      id-token: write
    outputs:
      reason: ${{ steps.tell.outputs.reason || steps.outside.outputs.reason }}
      running: ${{ steps.tell.outputs.running }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: The release name
        run: |
          printf '%s' "$TAG" | grep -Eq '^(hub-)?v[1-9][0-9]{0,11}$' || { echo "::error::not a release: $TAG"; exit 1; }
      - name: Join the tailnet as the CI
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:trommi-ci
      - name: Tell the server
        id: tell
        run: |
          set -u
          url="http://$HUB_SERVER:$HUB_DEPLOY_PORT"
          # why this run failed, for the issue (job report): one line
          fail() {
            printf 'reason=%s\n' "$(printf '%s' "$1" | tr '\n' ' ' | cut -c1-900)" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          # Tried again: no connection (the server may be starting after a reboot) and "busy" (another deploy, or the
          # updater changing itself). Every other answer is final: a deploy that failed is not asked for twice.
          for try in 1 2 3 4 5 6 7 8 9; do
            status=0
            code=$(curl -sS --connect-timeout 10 --max-time 900 -o answer.json -w '%{http_code}' \
              -X POST -H 'content-type: application/json' --data "{\"tag\":\"$TAG\"}" "$url/deploy") || status=$?
            if [ "$status" = 6 ] || [ "$status" = 7 ]; then echo "no connection (try $try)"
            elif [ "$status" = 0 ] && [ "$code" = 503 ]; then echo "the server is busy (try $try)"
            else break
            fi
            sleep 20
          done
          if [ "$status" = 6 ] || [ "$status" = 7 ]; then
            {
              echo "### Hub: \`$TAG\` is published, NOT delivered"
              echo
              echo "Nothing answers on the server's deploy port. If the server has not had its first installation yet,"
              echo "that is expected: run \`hub/deploy/install.sh install $TAG\` on the owner's laptop."
              echo "Otherwise the server or its updater is down; once it is back, start this workflow by hand with \`$TAG\`."
            } >> "$GITHUB_STEP_SUMMARY"
            fail "$TAG is published but was not delivered: nothing answers on the server's deploy port (not set up yet, or down)"
          fi
          if [ "$status" != 0 ] || ! jq -e . answer.json > /dev/null 2>&1; then
            echo "### Hub: no usable answer from the server (curl exit $status, HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
            fail "no usable answer from the server's deploy endpoint (curl exit $status, HTTP $code); ask it: ssh root@$HUB_SERVER trommi-hub-updater status"
          fi
          printf 'running=%s\n' "$(jq -r '.running // ""' answer.json | tr -cd 'A-Za-z0-9-')" >> "$GITHUB_OUTPUT"
          {
            echo "### Hub deploy: $(jq -r .result answer.json)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| asked for | \`$TAG\` |"
            echo "| hub that runs now | \`$(jq -r '.running // "none"' answer.json)\` |"
            echo "| commit | \`$(jq -r '.commit // "?"' answer.json)\` |"
            echo "| SHA-256 of the hub | \`$(jq -r '.sha256 // "?"' answer.json)\` |"
            echo "| dry run on a copy of the data | $(jq -r 'if .dry_run then .dry_run.result + ": " + .dry_run.detail else "not run" end' answer.json) |"
            echo "| health | $(jq -r 'if .health then (if .health.ok then "well" else "NOT well: " + .health.detail end) + " after " + (.health.seconds | tostring) + " s" else "not asked" end' answer.json) |"
            echo "| put back | $(jq -r 'if .rollback_health then (if .rollback_health.ok then "the release before, and it is well" else "the release before, and it is NOT well: " + .rollback_health.detail end) else "no" end' answer.json) |"
            echo "| data | $(jq -r 'if .data then .data.result + ": " + .data.detail else "untouched" end' answer.json) |"
            echo "| updater that answered | \`$(jq -r '.updater.release // "?"' answer.json)\`$(jq -r 'if .updater.next then ", changing to `" + .updater.next + "`" else "" end' answer.json)$(jq -r 'if .updater.reverted then "; the updater of `" + .updater.reverted + "` did not come up" else "" end' answer.json) |"
            echo "| server says | $(jq -r .message answer.json) |"
          } >> "$GITHUB_STEP_SUMMARY"
          jq . answer.json
          # Refused because something newer already runs (a later build got there first): nothing to do, not a failure.
          running=$(jq -r '.running // ""' answer.json)
          if [ "$(jq -r .result answer.json)" = refused ] && [ "${running##*v}" -gt "${TAG##*v}" ] 2>/dev/null; then
            echo "::notice::$running already runs, which is newer than $TAG; nothing was changed"
            exit 0
          fi
          [ "$(jq -r .ok answer.json)" = true ] || fail "the server reports $(jq -r .result answer.json): $(jq -r .message answer.json)"
          jq -r '.commit // ""' answer.json > commit.txt

          # The updater replaces itself after it has answered. Wait until the new one answers, or the old one says
          # that the new one did not come up.
          next=$(jq -r '.updater.next // empty' answer.json)
          [ -n "$next" ] || exit 0
          for _ in $(seq 1 60); do
            sleep 5
            curl -sS --connect-timeout 5 --max-time 20 -o status.json "$url/status" 2>/dev/null || continue
            release=$(jq -r '.updater.release // empty' status.json 2>/dev/null) || continue
            reverted=$(jq -r '.updater.reverted // empty' status.json 2>/dev/null) || continue
            if [ "$reverted" = "$next" ]; then
              echo "The updater of \`$next\` did not come up; the one of \`$release\` runs again. The hub \`$TAG\` runs." >> "$GITHUB_STEP_SUMMARY"
              fail "the updater of $next did not come up; the server put its previous updater back (the hub $TAG runs)"
            fi
            if [ "$release" = "$next" ]; then
              echo "The updater of \`$next\` runs." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          fail "the server's updater did not answer as $next within five minutes"
      # What people reach: the hub behind the tunnel must answer as the commit the server reported, within minutes.
      - name: The hub from outside
        id: outside
        run: |
          set -u
          want=$(cat commit.txt 2>/dev/null || true)
          [ -n "$want" ] || exit 0
          got=''
          for _ in $(seq 1 36); do
            got=$(curl -fsS --max-time 10 https://hub.trommi.com/healthz 2>/dev/null | jq -r '.commit // ""' 2>/dev/null) || got=''
            [ "$got" = "$want" ] && { echo "https://hub.trommi.com answers as $want"; exit 0; }
            sleep 5
          done
          reason="https://hub.trommi.com/healthz does not answer as $want after three minutes (it answers as ${got:-nothing})"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          echo "::error::$reason"
          exit 1

  # One open issue per failing delivery, closed by the next one that goes through. Only this job may write issues.
  report:
    name: Report
    needs: deliver
    if: ${{ !cancelled() && (needs.deliver.result == 'failure' || needs.deliver.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RESULT: ${{ needs.deliver.result }}
      REASON: ${{ needs.deliver.outputs.reason }}
      RUNNING: ${{ needs.deliver.outputs.running }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEALTH_URL: https://hub.trommi.com/healthz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: sh .github/scripts/deploy_issue.sh Hub
