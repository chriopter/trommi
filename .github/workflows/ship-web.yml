# The web app (app/web), from a push to main to https://app.trommi.com (the Cloudflare worker trommi-app), on its own:
# it waits for no other part.
#
#   decide    whether the web app must be delivered: what app.trommi.com serves was built from other inputs than this
#             commit's (.github/scripts/deployed.sh; a delivery that failed is made again by the next run); its
#             number N (this workflow's run number plus RELEASE_BASE)
#   checks    the web app's checks and, when the core changed, the core's, every test (.github/actions/check-*)
#   build     beside the checks: the files the worker serves, the worker, its settings and the manifest that names every
#             file (.github/scripts/web_release.mjs), and web.tar.gz with its manifest for the release
#   attest    every file checked against checksums.txt and the manifest against the run, then attested (GitHub's build
#             provenance; who built what, from which commit)
#   deliver   `wrangler deploy` of exactly those files, then asks app.trommi.com which commit it serves; a build that
#             arrives after a newer one is not delivered (the newest commit stays). Then the smoke test from outside
#             (.github/scripts/web_smoke.sh): the start page and every file it loads are this build's; when not, the
#             build before is put back at once (wrangler rollback)
#   release   web-v<N> (sign-release.yml): the release notes and web.tar.gz, signed and attested, never latest
#   report    a failed delivery opens the issue "Web update web-v<N> failed" (label deploy-failed), the next good one
#             closes it
# By hand (Actions -> ship-web -> Run workflow, on main): `run_id`, the id of an earlier run of this workflow on main
# whose web-release is delivered once more (its artifact is kept for 30 days); its web and core checks must have
# passed.
#
# Secrets: the environment `web` holds OP_SERVICE_ACCOUNT_TOKEN and OP_ENVIRONMENT_ID; CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID come from the 1Password Environment and are seen by the wrangler command only.
name: ship-web

on:
  push:
    branches: [main]
    paths:
      - app/web/**
      - tests/web/**
      - connector/tools.json
      - connector/prompt.md
      - demo/**
      - .node-version
      - core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/scripts/web_release.mjs
      - .github/scripts/web_smoke.sh
      - .github/scripts/wasm_core.sh
      - .github/scripts/deployed.sh
      - .github/scripts/inputs.sh
      - .github/scripts/release_notes.mjs
      - .github/tools/wrangler/**
      - .github/workflows/ship-web.yml
      - .github/actions/**
      - .github/scripts/changed_parts.sh
      - .github/scripts/source_tree.sh
      - .github/workflows/pr-check.yml
      - .github/workflows/sign-release.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of an earlier run of ship-web on main whose web release is delivered again
        required: true
        type: string

permissions: {}

# One run at a time; of the runs waiting only the newest (a started run, and so a delivery, is never cut off).
concurrency:
  group: ship-web
  cancel-in-progress: false

env:
  # web-v<N>: N is this workflow's run number plus this base (above every release number before the series began)
  RELEASE_BASE: 1000

jobs:
  decide:
    name: Must it be delivered
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deliver: ${{ steps.decide.outputs.web }}
      version: ${{ steps.decide.outputs.version }}
      parts: ${{ steps.decide.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: What app.trommi.com serves
        id: decide
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          echo "version=$((RUN_NUMBER + RELEASE_BASE))" >> "$GITHUB_OUTPUT"
          sh .github/scripts/inputs.sh > "$RUNNER_TEMP/inputs"
          sh .github/scripts/deployed.sh "$RUNNER_TEMP/inputs" web | tee "$RUNNER_TEMP/deliver"
          cat "$RUNNER_TEMP/deliver" >> "$GITHUB_OUTPUT"
          flag=$(sed -n 's/^web=//p' "$RUNNER_TEMP/deliver")
          { echo "parts<<PARTS_END"; sed -n "s/^\(web [0-9a-f]\{64\}\)\$/\1 $flag/p" "$RUNNER_TEMP/inputs"; echo "PARTS_END"; } >> "$GITHUB_OUTPUT"

  # Which parts changed (since this workflow's newest green run on main), the core's checks when it did, and the part's
  # own checks: the steps are the composite actions of .github/actions, the ones a pull request runs as well
  changed:
    name: Which parts changed
    needs: decide
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      core: ${{ steps.find.outputs.core }}
      part: ${{ steps.find.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the changed parts
        id: find
        env:
          EVENT: ${{ github.event_name }}
          PARTS: web
          WORKFLOW: ship-web.yml
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/changed_parts.sh

  core:
    name: Core (check)
    needs: changed
    if: needs.changed.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
      NEXTEST_VERSION: 0.9.148
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-core

  web_check:
    name: Web app (check)
    needs: changed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
      NEXTEST_VERSION: 0.9.148
      CARGO_INCREMENTAL: '0'
      WEB_HUB_URL: https://hub.trommi.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-web

  # The result of the checks, for the jobs that need them: the part's passed, the core's passed or was not asked for
  checks:
    name: Checks
    needs: [changed, core, web_check]
    if: ${{ !cancelled() && needs.changed.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both passed
        env:
          PART: ${{ needs.web_check.result }}
          CORE: ${{ needs.core.result }}
        run: |
          echo "Web app (check): $PART, Core (check): $CORE"
          [ "$PART" = success ] && { [ "$CORE" = success ] || [ "$CORE" = skipped ]; }

  build:
    name: Build
    needs: decide
    if: github.event_name == 'push' && needs.decide.outputs.deliver == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The hub the app speaks to. The build is checked against it: the page's policy must name this hub and no other.
      WEB_HUB_URL: https://hub.trommi.com
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Compiler (rust-toolchain.toml)
        run: sh .github/scripts/rust_toolchain.sh wasm32-unknown-unknown
      - name: The core's inputs
        id: core
        run: echo "key=$(sh .github/scripts/wasm_core.sh key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pkg
        with:
          path: core/bindings/wasm/pkg
          key: ${{ steps.core.outputs.key }}
      - name: The Rust core for the browser
        env:
          HIT: ${{ steps.pkg.outputs.cache-hit }}
        run: sh .github/scripts/wasm_core.sh build
      - name: Packages
        working-directory: app/web
        run: npm ci --no-audit --no-fund
      - name: Build
        run: node app/web/dev/build.mjs --write
      # What is delivered: the files, the worker, its settings, and the manifest that names every file.
      - name: Put the release together
        run: |
          set -eu
          node .github/scripts/web_release.mjs app/web/public out
          (cd out && sha256sum -c --quiet checksums.txt)
          # the settings are tried as wrangler reads them; nothing is sent
          npm ci --no-audit --no-fund --ignore-scripts --prefix .github/tools/wrangler
          (cd out && WRANGLER_SEND_METRICS=false ../.github/tools/wrangler/node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry")
          {
            echo "### Web app, build $VERSION"
            echo
            echo "hub \`$WEB_HUB_URL\`, $(jq '.files | length' out/manifest.json) files, manifest \`$(sha256sum out/manifest.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-release
          path: out/
          if-no-files-found: error
          retention-days: 30
      # The web app's release web-v<N>: web.tar.gz (the same bytes for the same files: names sorted, no times, no
      # owners) and a manifest that names it, with the web app's inputs.
      - name: The web app's release
        env:
          PARTS: ${{ needs.decide.outputs.parts }}
        run: |
          set -eu
          mkdir webrel
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C out -cf - . | gzip -9n > webrel/web.tar.gz
          printf '%s' "$PARTS" | grep -Eq '^web [0-9a-f]{64} (true|false)$' || { echo "::error::the web app's inputs are not known"; exit 1; }
          PARTS="$PARTS" release/manifest.sh trommi-web "$VERSION" "$GITHUB_SHA" webrel/web.tar.gz > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" webrel/manifest.json
          release/sign.sh files webrel/manifest.json
          cat webrel/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-part-release
          path: webrel/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Check and attest
    needs: [decide, checks, build]
    # a push: when the web app's checks and the core's passed and the web app must be delivered; by hand: always
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.decide.outputs.deliver == 'true'
      && needs.checks.result == 'success' && needs.build.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
      attestations: write
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
      manifest: ${{ steps.check.outputs.manifest }}
    steps:
      # A run named by hand must be a build of the main branch of this repository: a pull request's run also has
      # artifacts, and nothing of such a run may be signed, attested or delivered.
      - name: The run that is delivered again
        id: source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          printf '%s' "$RUN_ID" | grep -Eq '^[1-9][0-9]{0,19}$' || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg r "$GITHUB_REPOSITORY" \
            '.path == ".github/workflows/ship-web.yml" and .head_branch == "main" and .event == "push" and .repository.full_name == $r and .head_repository.full_name == $r' \
            "$RUNNER_TEMP/run.json" > /dev/null || { echo "::error::run $RUN_ID is not a build of the main branch of this repository"; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion == "success") | .name' > "$RUNNER_TEMP/jobs.txt"
          grep -Fxq "Web app (check)" "$RUNNER_TEMP/jobs.txt" || { echo "::error::the job Web app (check) of run $RUN_ID did not succeed"; exit 1; }
          # the core's check of that run passed, or was skipped (the core did not change): as for a delivery by a build
          core=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --jq '.jobs[] | select(.name == "Core (check)") | .conclusion')
          case "$core" in success|skipped) ;; *) echo "::error::the job Core (check) of run $RUN_ID: ${core:-not there}"; exit 1 ;; esac
          echo "commit=$(jq -r .head_sha "$RUNNER_TEMP/run.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-release
          path: release
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The files are the ones the build named
        id: check
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          COMMIT: ${{ github.event_name == 'push' && github.sha || steps.source.outputs.commit }}
        run: |
          set -eu
          cd release
          sha256sum -c --quiet checksums.txt
          # nothing lies in the release that the list does not name
          find . -type f ! -path ./checksums.txt | sed 's|^\./||' | sort > "$RUNNER_TEMP/there"
          cut -d' ' -f3- checksums.txt | sort > "$RUNNER_TEMP/named"
          diff "$RUNNER_TEMP/named" "$RUNNER_TEMP/there" || { echo "::error::the release holds files checksums.txt does not name"; exit 1; }
          jq -e --arg r "$GITHUB_REPOSITORY" '.product == "trommi-web" and .repository == $r and .worker == "trommi-app" and .host == "app.trommi.com"' manifest.json > /dev/null \
            || { echo "::error::manifest.json is not a web release of this repository"; exit 1; }
          commit=$(jq -r .commit manifest.json)
          version=$(jq -r .version manifest.json)
          printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::the manifest names no commit"; exit 1; }
          printf '%s' "$version" | grep -Eq '^[1-9][0-9]{0,11}$' || { echo "::error::the manifest names no version"; exit 1; }
          # the release must be of the commit the run built, and called by a build also of its number
          [ "$commit" = "$COMMIT" ] || { echo "::error::the release is of $commit, the run built $COMMIT"; exit 1; }
          if [ -n "$VERSION" ] && [ "$version" != "$VERSION" ]; then echo "::error::the release is build $version, asked for was build $VERSION"; exit 1; fi
          # the manifest and the list agree file by file
          jq -r '.files[] | "\(.sha256)  \(.name)"' manifest.json | sort > "$RUNNER_TEMP/manifest-sums"
          grep -v '  manifest\.json$' checksums.txt | sort > "$RUNNER_TEMP/list-sums"
          diff "$RUNNER_TEMP/manifest-sums" "$RUNNER_TEMP/list-sums" || { echo "::error::manifest.json and checksums.txt do not agree"; exit 1; }
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "manifest=$(sha256sum manifest.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Attest the files and the manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/checksums.txt

  deliver:
    name: Deliver to Cloudflare
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: web
      url: https://app.trommi.com
    # one delivery at a time; a waiting one is not cut off
    concurrency:
      group: deploy_web
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      reason: ${{ steps.smoke.outputs.reason || steps.ask.outputs.reason }}
    env:
      COMMIT: ${{ needs.attest.outputs.commit }}
      VERSION: ${{ needs.attest.outputs.version }}
      MANIFEST: ${{ needs.attest.outputs.manifest }}
    steps:
      # only the pinned wrangler is taken from the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/tools/wrangler
            .github/scripts/web_smoke.sh
            .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-release
          path: release
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The files are the attested ones
        run: |
          set -eu
          # The artifact is fetched a second time here. Only the manifest's hash came from the job that attested, so
          # every file is checked against that manifest, and nothing may lie beside what it names.
          [ "$(sha256sum release/manifest.json | cut -d' ' -f1)" = "$MANIFEST" ] || { echo "::error::manifest.json is not the attested one"; exit 1; }
          cd release
          jq -r '.files[] | "\(.sha256)  \(.name)"' manifest.json > "$RUNNER_TEMP/manifest-sums"
          sha256sum -c --quiet "$RUNNER_TEMP/manifest-sums"
          find . -type f ! -path ./checksums.txt ! -path ./manifest.json | sed 's|^\./||' | sort > "$RUNNER_TEMP/there"
          jq -r '.files[].name' manifest.json | sort > "$RUNNER_TEMP/named"
          diff "$RUNNER_TEMP/named" "$RUNNER_TEMP/there" || { echo "::error::the release holds files the attested manifest does not name"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: wrangler (pinned in .github/tools/wrangler)
        run: npm ci --no-audit --no-fund --ignore-scripts --prefix .github/tools/wrangler
      - name: Install the 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          # a fixed release, never a moving channel: `op run --environment` is in the 2.42 betas, not yet in stable 2.40.0
          version: 2.42.0-beta.01
      # Two deliveries may arrive out of order (a slow run of an older commit after a quick run of a newer one). A
      # delivery called by a build is left out when the site already serves a commit that comes after this one on
      # main. A delivery by hand is always made: that is how an older build is put back.
      # The check is a step of this job, not a job before it: only inside the job's concurrency group is it sure that no
      # other delivery lands between the question and the deploy. The price: GitHub's list of deployments shows such a
      # left-out build as a deployment of `web`; the run's summary says that nothing was delivered.
      - name: Is something newer served already
        id: newer
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # Asked up to three times. What cannot be found out stops the delivery (an older build must not land on a
          # newer one unseen); a delivery by hand does not ask.
          page= ; status=
          for try in 1 2 3; do
            if page=$(curl -sS --max-time 10 -w '\n%{http_code}' "https://app.trommi.com/gen/build.txt?ci=$GITHUB_RUN_ID-before-$try"); then break; fi
            page= ; sleep 5
          done
          [ -n "$page" ] || { echo "::error::app.trommi.com did not answer: which build it serves is not known, nothing was delivered. Deliver by hand (ship-web, run_id $GITHUB_RUN_ID) once it answers."; exit 1; }
          served=$(printf '%s\n' "$page" | sed -n 's/^commit: //p' | head -n 1)
          # a site that names no commit (never delivered to, or not this app): delivering
          printf '%s' "$served" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "the site names no commit (HTTP $(printf '%s\n' "$page" | tail -n 1)): delivering"; exit 0; }
          # how the served commit lies to this one: ahead = it comes after this one
          missing=
          for try in 1 2 3; do
            if full=$(gh api "repos/$GITHUB_REPOSITORY/commits/$served" --jq .sha 2>"$RUNNER_TEMP/commit.err"); then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...$full" --jq .status 2>/dev/null) && break
            elif grep -Eq 'HTTP (404|422)' "$RUNNER_TEMP/commit.err"; then
              # GitHub does not know the served commit (history rewritten, e.g. re-signed): it cannot be newer
              missing=1; break
            fi
            status= ; sleep 5
          done
          if [ -n "$missing" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::notice::app.trommi.com serves $served, a commit this repository does not know: unknown, delivering"
              exit 0
            fi
            echo "::error::app.trommi.com serves $served, a commit this repository does not know; only main delivers then. Nothing was delivered."
            exit 1
          fi
          echo "app.trommi.com serves $served, which is ${status:-unknown} compared with $COMMIT"
          [ -n "$status" ] || { echo "::error::how $served lies to $COMMIT could not be found out, nothing was delivered. Deliver by hand (ship-web, run_id $GITHUB_RUN_ID)."; exit 1; }
          if [ "$status" = ahead ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "served=$served" >> "$GITHUB_OUTPUT"
            echo "::notice::app.trommi.com already serves $served, which is newer than this build; nothing was delivered"
          fi
      - name: Deliver
        if: steps.newer.outputs.skip != 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -eu
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "::error::OP_SERVICE_ACCOUNT_TOKEN is not set for this run"; exit 1; }
          test -n "$OP_ENVIRONMENT_ID" || { echo "::error::OP_ENVIRONMENT_ID is not set for this run"; exit 1; }
          wrangler="$PWD/.github/tools/wrangler/node_modules/.bin/wrangler"
          cd release
          # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID come from the 1Password Environment
          op run --environment "$OP_ENVIRONMENT_ID" -- "$wrangler" deploy --message "build $VERSION of $COMMIT"
      # What the site serves now must be this build (a rollout takes a moment).
      - name: Ask app.trommi.com
        id: ask
        if: steps.newer.outputs.skip != 'true'
        run: |
          set -u
          short=$(printf '%s' "$COMMIT" | cut -c1-7)
          got=
          for try in $(seq 1 30); do
            got=$(curl -fsS --max-time 10 "https://app.trommi.com/gen/build.txt?ci=$GITHUB_RUN_ID-$try" | sed -n 's/^commit: //p' | head -n 1 || true)
            echo "try $try: app.trommi.com serves ${got:-nothing}"
            [ "$got" = "$short" ] && break
            sleep 5
          done
          {
            echo "### Web app: build $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$COMMIT\` |"
            echo "| app.trommi.com serves | \`${got:-nothing}\` |"
            echo "| manifest (SHA-256) | \`$MANIFEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$short" ] || {
            echo "reason=app.trommi.com does not serve $short after two and a half minutes (it serves ${got:-nothing})" >> "$GITHUB_OUTPUT"
            echo "::error::app.trommi.com does not serve $short"
            exit 1
          }
      # What a browser gets now is this release, byte for byte, and the start page can load (.github/scripts/web_smoke.sh).
      - name: Smoke test
        id: smoke
        if: steps.newer.outputs.skip != 'true'
        run: |
          set -u
          if reason=$(sh .github/scripts/web_smoke.sh release "$COMMIT"); then exit 0; fi
          printf 'reason=%s\n' "the smoke test after the delivery failed: $reason; the build before was put back" >> "$GITHUB_OUTPUT"
          echo "::error::$reason"
          exit 1
      # A delivery that does not pass the smoke test is taken back: Cloudflare serves the version before again
      # (wrangler rollback: the worker's previous version, with its files). The run stays red and the issue says why.
      - name: Put the build before back
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -eu
          wrangler="$PWD/.github/tools/wrangler/node_modules/.bin/wrangler"
          cd release
          op run --environment "$OP_ENVIRONMENT_ID" -- "$wrangler" rollback --yes --message "smoke test of build $VERSION ($COMMIT) failed"
          for try in $(seq 1 30); do
            got=$(curl -fsS --max-time 10 "https://app.trommi.com/gen/build.txt?ci=$GITHUB_RUN_ID-back-$try" | sed -n 's/^commit: //p' | head -n 1 || true)
            echo "try $try: app.trommi.com serves ${got:-nothing}"
            [ -n "$got" ] && [ "$got" != "$(printf '%s' "$COMMIT" | cut -c1-7)" ] && { echo "### Web app: put back, serves \`$got\` again" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 5
          done
          echo "::error::after the rollback app.trommi.com still serves ${got:-nothing}"
          exit 1
      - name: Nothing was delivered
        if: steps.newer.outputs.skip == 'true'
        env:
          SERVED: ${{ steps.newer.outputs.served }}
        run: |
          {
            echo "### Web app: build $VERSION was NOT delivered"
            echo
            echo "app.trommi.com already serves \`$SERVED\`, a commit that comes after \`$COMMIT\` on main."
          } >> "$GITHUB_STEP_SUMMARY"

  # The web app's signed release web-v<N> (sign-release.yml), once it is delivered: the release notes of that delivery
  # and web.tar.gz as it went out (attested). No browser checks it: it is the record of what went out, and the build
  # to put back.
  release:
    name: Web release
    needs: [decide, deliver]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.deliver.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/sign-release.yml
    with:
      part: web
      version: ${{ needs.decide.outputs.version }}
      commit: ${{ github.sha }}
      artifact: web-part-release
    secrets: inherit

  # One open issue per failing delivery, closed by the next one that goes through. Only this job may write issues.
  report:
    name: Report
    needs: [attest, deliver]
    if: ${{ !cancelled() && (needs.attest.result == 'failure' || needs.deliver.result == 'failure' || needs.deliver.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: web-v${{ needs.attest.outputs.version || inputs.run_id }}
      RESULT: ${{ (needs.attest.result == 'failure' || needs.deliver.result == 'failure') && 'failure' || 'success' }}
      REASON: ${{ needs.deliver.outputs.reason || (needs.attest.result == 'failure' && 'the files could not be checked or attested (job Check and attest)') || 'a step of the job Deliver to Cloudflare failed' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEALTH_URL: https://app.trommi.com/gen/build.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: sh .github/scripts/deploy_issue.sh Web
