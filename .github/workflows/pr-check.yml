# The checks of a pull request (the fast tier, about one to two minutes per part): which parts changed against the pull
# request's base, and for those: clippy and every Rust test but the slow ones (nextest profile `fast`,
# .config/nextest.toml), the web app's type check, lint and tests, its browser tests and its build, the iOS client
# package compiled (with its tests), the app compiled for iOS and the Mac, the Linux app and the website. The jobs' names
# are the checks the ruleset of main requires: Which parts changed, Core (check), Web app (check), Connector (check),
# Hub (check), iOS client (check). A part that did not change skips its job, which counts as passed; when finding the
# changed parts fails, every check runs. A pull request gets no secret and delivers nothing.
#
# The steps of each check are a composite action (.github/actions/check-*), which the part's ship-*.yml on main uses too,
# with every test (profile `ci`). The giant tests, fuzzing, the torture run and the connector under load are nightly
# (nightly.yml).
name: pr-check

on:
  pull_request:

permissions: {}

# A newer commit cuts the older run off.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  NEXTEST_VERSION: 0.9.148
  # fast on a pull request, ci (every test) in a ship-*.yml
  NEXTEST_PROFILE: fast

jobs:
  changes:
    name: Which parts changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      core: ${{ steps.find.outputs.core }}
      web: ${{ steps.find.outputs.web }}
      connector: ${{ steps.find.outputs.connector }}
      hub: ${{ steps.find.outputs.hub }}
      apple: ${{ steps.find.outputs.apple }}
      linux: ${{ steps.find.outputs.linux }}
      site: ${{ steps.find.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # a crate, a test target or a browser test that no workflow runs fails here (.github/scripts/ci_coverage.mjs)
      - name: Every test is run by a workflow
        run: node .github/scripts/ci_coverage.mjs
      - name: Find the changed parts
        id: find
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/changed_parts.sh

  # The shared core's own tests: the crates' unit tests and the scenario tests under tests/core and tests/bindings.
  core:
    name: Core (check)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-core

  web:
    name: Web app (check)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WEB_HUB_URL: https://hub.trommi.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-web

  connector:
    name: Connector (check)
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-connector

  hub:
    name: Hub (check)
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-hub

  ios_client:
    name: iOS client (check)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-ios-client

  ios_app:
    name: iOS app (build)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: What the core for Swift is built from
        id: core_inputs
        run: |
          set -eu
          sum=$( { git ls-tree -r HEAD -- core/ Cargo.toml Cargo.lock rust-toolchain.toml; xcodebuild -version; } | shasum -a 256 | cut -c1-64)
          echo "key=ios-core-$RUNNER_OS-$RUNNER_ARCH-$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core_cache
        with:
          key: ${{ steps.core_inputs.outputs.key }}
          path: |
            core/bindings/swift/TrommiCoreRust/lib
            core/bindings/swift/TrommiCoreRust/Sources/TrommiCoreFFI/include/TrommiCoreFFI.h
            core/bindings/swift/TrommiCoreRust/Sources/TrommiCoreRust/TrommiCoreRust.swift
      - name: Compiler (rust-toolchain.toml)
        if: steps.core_cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          rustup toolchain install || rustup show
          rustup component add llvm-tools
      - name: The Rust core for Swift
        if: steps.core_cache.outputs.cache-hit != 'true'
        env:
          TROMMI_SIMULATOR: "0"
        run: |
          set -eu
          DARWIN_CLANG_RT="$(xcrun --sdk iphoneos clang -print-resource-dir)/lib/darwin"
          export DARWIN_CLANG_RT
          sh core/bindings/swift/build.sh
      - name: XcodeGen
        run: |
          set -eu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec app/ios/TrommiApp/AppStore/project.yml
      - name: Build for iOS
        run: |
          xcodebuild build -quiet -project app/ios/TrommiApp/AppStore/Trommi.xcodeproj -scheme Trommi -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build for the Mac
        run: |
          xcodebuild build -quiet -project app/ios/TrommiApp/AppStore/Trommi.xcodeproj -scheme TrommiMac -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedDataMac" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            TROMMI_MAC_ENTITLEMENTS=../Mac/TrommiMac.dev.entitlements

  # The Linux app (app/linux): its build, its tests and a smoke test of the window (Qt offscreen: the QML loads, the
  # window draws the sign-in screen and writes a picture of itself, kept as the run's artifact).
  linux:
    name: Linux app (check)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-linux

  site:
    name: Site (test)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            site
            tests/site
            .node-version
      - uses: ./.github/actions/check-site
