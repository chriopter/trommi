# The Mac app for direct download (README.md "Mac app (direct download)"): Trommi-macOS.dmg on its own release mac-v<N>,
# signed with the team's Developer ID certificate, notarized by Apple and stapled, beside TestFlight's Mac build
# (deploy_ios.yml, jobs mac and mac_processed), which stays as it is.
#
# After every run of build.yml on main (workflow_run), for that run's commit and number N (run number plus
# RELEASE_BASE of that commit's build.yml):
#   release  whether the app is built (.github/scripts/mac_release.sh check): the build run's "Core (check)" passed
#            (or was skipped), and the commit's iOS inputs differ from those of the newest Mac app released. Else
#            nothing runs.
#   build    on a Mac, the Rust core for the Mac (cached by its inputs), then
#            .github/scripts/mac_direct.sh build: archive, Developer ID export with hardened runtime, notarytool,
#            staple, the .dmg (signed, notarized, stapled), Gatekeeper's verdict, the SHA-256. Without the certificate
#            or the App Store Connect key it ends green with a notice and nothing is released: never an unsigned app.
#   attach   Trommi-macOS.json written (release, commit, iOS inputs, SHA-256, size), the three files attested
#            (GitHub's build provenance) and released as mac-v<N>, marked latest, so that
#            https://github.com/trommi/trommi/releases/latest/download/Trommi-macOS.dmg is always the newest app (a
#            published file is never replaced).
#   report   a failed build or attach opens the issue "Mac build v<N> failed" (label build-failed); the next one that
#            passes closes it.
# By hand (Actions -> mac -> Run workflow, on main): `run_id`, a finished build.yml run of main, whose commit is built
# and released (when its app is not out there yet); `dry_run` builds, signs and notarizes but releases nothing.
#
# Secrets: the environment `mac` holds OP_SERVICE_ACCOUNT_TOKEN and OP_ENVIRONMENT_ID of a 1Password Environment with
# APPLE_DEVID_P12, APPLE_DEVID_P12_PASSWORD (the Developer ID Application certificate and its key) and APPLE_ASC_KEY,
# APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER_ID, APPLE_TEAM_ID (as for TestFlight: Xcode's Developer ID profile and
# notarytool). Only the job build sees them.
name: mac

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of a finished build.yml run of main whose commit is built
        required: true
        type: string
      dry_run:
        description: Build, sign and notarize only; attach nothing
        required: false
        type: boolean
        default: false

permissions: {}

# After build.yml: one run at a time, and of the runs waiting only the newest; a started run is never cut off. A
# replaced run's app is not lost: the newest builds when the newest Mac app on a release is of other iOS inputs than its
# release's (mac_release.sh check), also when its release leaves the app unchanged. By hand: a run of its own.
concurrency:
  group: mac-${{ github.event_name == 'workflow_run' && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: The release
    # workflow_run: only a build of main of this repository, by a push or by hand; by hand: only from main
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      version: ${{ steps.check.outputs.version }}
      run_id: ${{ steps.check.outputs.run_id }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      # the scripts of the revision this workflow runs from; the whole history, for the release's commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whether the app is built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -eu
          printf '%s' "$RUN_ID" | grep -Eq '^[1-9][0-9]{0,19}$' || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          COMMIT=$(jq -r .head_sha "$RUNNER_TEMP/run.json") RUN_NUMBER=$(jq -r .run_number "$RUNNER_TEMP/run.json")
          printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::not a commit: $COMMIT"; exit 1; }
          # the base of the build run's own build.yml: main may have moved on (and changed it) since that run
          base=$(git show "$COMMIT:.github/workflows/build.yml" | sed -n 's/^  RELEASE_BASE: \([0-9][0-9]*\)$/\1/p')
          [ "$(printf '%s' "$base" | grep -c .)" = 1 ] || { echo "::error::build.yml names no single RELEASE_BASE"; exit 1; }
          VERSION=$((RUN_NUMBER + base))
          export VERSION COMMIT RUN_ID
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          bash .github/scripts/mac_release.sh check

  build:
    name: Build, sign, notarize (Mac)
    needs: release
    if: needs.release.outputs.mode == 'build'
    # macOS with Xcode 27, Apple silicon (the app is arm64 only)
    runs-on: xcode-27
    timeout-minutes: 120
    # reads the secrets of the environment without counting as a deployment of it
    environment:
      name: mac
      deployment: false
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.app.outputs.ready }}
      version: ${{ steps.app.outputs.version }}
    env:
      COMMIT: ${{ needs.release.outputs.commit }}
      VERSION: ${{ needs.release.outputs.version }}
      # XcodeGen, by the SHA-256 of its release archive (as deploy_ios.yml)
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      # Fails closed: an environment without 1Password access builds nothing and says so
      - name: Is signing set up
        id: setup
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
        run: |
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ] && [ -n "$OP_ENVIRONMENT_ID" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the environment mac has no OP_SERVICE_ACCOUNT_TOKEN or OP_ENVIRONMENT_ID: the Mac app for direct download is not built (README.md \"Mac app (direct download)\")"
            echo "### Mac (direct download): not built, the environment mac is not set up" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.setup.outputs.ready == 'yes'
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      # The Rust core for the Mac (core/swift/build.sh macos), taken from an earlier run when built from the same paths
      - name: What the core for the Mac is built from
        id: core_inputs
        if: steps.setup.outputs.ready == 'yes'
        run: |
          set -eu
          sum=$( { git ls-tree -r HEAD -- core/ client/ Cargo.toml Cargo.lock rust-toolchain.toml; xcodebuild -version; } | shasum -a 256 | cut -c1-64)
          echo "key=mac-core-$RUNNER_OS-$RUNNER_ARCH-$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core_cache
        if: steps.setup.outputs.ready == 'yes'
        with:
          key: ${{ steps.core_inputs.outputs.key }}
          path: |
            core/swift/TrommiCoreRust/lib/macos
            core/swift/TrommiCoreRust/Sources/TrommiCoreFFI/include/TrommiCoreFFI.h
            core/swift/TrommiCoreRust/Sources/TrommiCoreRust/TrommiCoreRust.swift
      - name: Compiler (rust-toolchain.toml)
        if: steps.setup.outputs.ready == 'yes' && steps.core_cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          rustup toolchain install || rustup show
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.setup.outputs.ready == 'yes' && steps.core_cache.outputs.cache-hit != 'true'
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The Rust core for the Mac
        if: steps.setup.outputs.ready == 'yes' && steps.core_cache.outputs.cache-hit != 'true'
        run: sh core/swift/build.sh macos
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.setup.outputs.ready == 'yes' && steps.core_cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.core_inputs.outputs.key }}
          path: |
            core/swift/TrommiCoreRust/lib/macos
            core/swift/TrommiCoreRust/Sources/TrommiCoreFFI/include/TrommiCoreFFI.h
            core/swift/TrommiCoreRust/Sources/TrommiCoreRust/TrommiCoreRust.swift
      - name: XcodeGen
        if: steps.setup.outputs.ready == 'yes'
        run: |
          set -eu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "XCODEGEN=$RUNNER_TEMP/xcodegen/bin/xcodegen" >> "$GITHUB_ENV"
      - name: Install the 1Password CLI
        if: steps.setup.outputs.ready == 'yes'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          # a fixed release, never a moving channel: `op run --environment` is in the 2.42 betas, not yet in stable 2.40.0
          version: 2.42.0-beta.01
      - name: Build, sign, notarize
        id: app
        if: steps.setup.outputs.ready == 'yes'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
        run: op run --environment "$OP_ENVIRONMENT_ID" -- bash .github/scripts/mac_direct.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.app.outputs.ready == 'yes'
        with:
          name: mac-direct
          path: ${{ runner.temp }}/mac-direct/
          if-no-files-found: error
          retention-days: 14
      - name: No key or keychain is left
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mac-direct.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/mac-direct-keys" "$RUNNER_TEMP/ExportOptionsMacDirect.plist"

  attach:
    name: Release mac-v<N>
    needs: [release, build]
    if: needs.build.outputs.ready == 'yes' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
      COMMIT: ${{ needs.release.outputs.commit }}
      RUN_ID: ${{ needs.release.outputs.run_id }}
      MAC_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-direct
          path: ${{ runner.temp }}/mac
      - name: Check, describe
        run: bash .github/scripts/mac_release.sh prepare "$RUNNER_TEMP/mac"
      - name: Attest the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/mac/Trommi-macOS.dmg
            ${{ runner.temp }}/mac/Trommi-macOS.dmg.sha256
            ${{ runner.temp }}/mac/Trommi-macOS.json
      - name: Release
        run: bash .github/scripts/mac_release.sh upload "$RUNNER_TEMP/mac"

  report:
    name: Report
    needs: [release, build, attach]
    if: ${{ !cancelled() && needs.release.outputs.mode == 'build' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: mac-v${{ needs.release.outputs.version }}
      WHAT: build
      RUNNING: the commit built, ${{ needs.release.outputs.commit }}
      LABEL: build-failed
      RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: |
          set -eu
          REASON="failed: $(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')"
          export REASON
          sh .github/scripts/deploy_issue.sh Mac
