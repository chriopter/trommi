# Manual entry point kept for existing bookmarks. Normal pushes use main.yml only.
name: ship-connector
on:
  workflow_dispatch:
permissions: {}
jobs:
  main:
    name: Run the main pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Check and deliver through main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main -f part=connector
