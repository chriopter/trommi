# The connector (connector/), from a push to main to its signed release connector-v<N>, on its own. A published
# connector release is delivered: install.sh and `trommi-connector update` take the newest at once.
#
#   decide    whether it must be released: the newest connector-v<N> (or, before the first, v<N>) was built from other
#             inputs than this commit's (.github/scripts/deployed.sh); the number N (this workflow's run number plus
#             RELEASE_BASE, compiled into the binaries: a connector never takes a release older than itself)
#   checks    the connector's checks and, when the core changed, the core's, every test (.github/actions/check-*)
#   build     beside the checks: the four release binaries, as connector/build-plugin.mjs makes them, one machine per
#             target at the same time
#   assemble  the four binaries and the manifest that names them; the very file is started once
#   hub       the one wait for another part: when this push changed the hub, the release waits until the hub's server
#             runs this commit's hub and updater (ship-hub.yml delivers them), so that a new connector never meets an
#             older hub than it was tested with; at most 45 minutes, then nothing is released
#   release   connector-v<N> (sign-release.yml): signed, attested, never latest
#   report    a failed run opens the issue "Connector build connector-v<N> failed" (label build-failed), the next good
#             one closes it
#
# Secrets: none here but the signing job of sign-release.yml (environment `connector`, the release key).
name: ship-connector

on:
  push:
    branches: [main]
    paths:
      - connector/**
      - install.sh
      - .claude-plugin/**
      - .node-version
      - release/**
      - tests/connector/**
      - tests/src/**
      - tests/Cargo.toml
      - core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/scripts/deployed.sh
      - .github/scripts/inputs.sh
      - .github/scripts/release_notes.mjs
      - .github/workflows/ship-connector.yml
      - .github/actions/**
      - .github/scripts/changed_parts.sh
      - .github/workflows/pr-check.yml
      - .github/workflows/sign-release.yml
  workflow_dispatch:

permissions: {}

# One run at a time; of the runs waiting only the newest (a started run, and so a release, is never cut off).
concurrency:
  group: ship-connector
  cancel-in-progress: false

env:
  # connector-v<N>: above every release number before the series began (v375); connectors refuse older releases
  RELEASE_BASE: 1000

jobs:
  decide:
    name: Must it be released
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deliver: ${{ steps.decide.outputs.connector }}
      version: ${{ steps.decide.outputs.version }}
      parts: ${{ steps.decide.outputs.parts }}
      hub: ${{ steps.hub.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The newest connector release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          echo "version=$((RUN_NUMBER + RELEASE_BASE))" >> "$GITHUB_OUTPUT"
          sh .github/scripts/inputs.sh > "$RUNNER_TEMP/inputs"
          sh .github/scripts/deployed.sh "$RUNNER_TEMP/inputs" connector | tee "$RUNNER_TEMP/deliver"
          cat "$RUNNER_TEMP/deliver" >> "$GITHUB_OUTPUT"
          flag=$(sed -n 's/^connector=//p' "$RUNNER_TEMP/deliver")
          { echo "parts<<PARTS_END"; sed -n "s/^\(connector [0-9a-f]\{64\}\)\$/\1 $flag/p" "$RUNNER_TEMP/inputs"; echo "PARTS_END"; } >> "$GITHUB_OUTPUT"
      # whether this push changed what the hub or its updater is built from (ship-hub.yml delivers it)
      - name: Did this push change the hub
        id: hub
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if printf '%s' "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            a=$(sh .github/scripts/inputs.sh "$BEFORE" | grep -E '^(hub|updater) ')
            b=$(sh .github/scripts/inputs.sh | grep -E '^(hub|updater) ')
            if [ "$a" = "$b" ]; then echo "changed=false"; else echo "changed=true"; fi
          else
            echo "changed=true"
          fi | tee -a "$GITHUB_OUTPUT"

  # Which parts changed (since this workflow's newest green run on main), the core's checks when it did, and the part's
  # own checks: the steps are the composite actions of .github/actions, the ones a pull request runs as well
  changed:
    name: Which parts changed
    needs: decide
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      core: ${{ steps.find.outputs.core }}
      part: ${{ steps.find.outputs.connector }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the changed parts
        id: find
        env:
          EVENT: ${{ github.event_name }}
          PARTS: connector
          WORKFLOW: ship-connector.yml
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/changed_parts.sh

  core:
    name: Core (check)
    needs: changed
    if: needs.changed.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
      NEXTEST_VERSION: 0.9.148
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-core

  connector_check:
    name: Connector (check)
    needs: changed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
      NEXTEST_VERSION: 0.9.148
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-connector

  # The result of the checks, for the jobs that need them: the part's passed, the core's passed or was not asked for
  checks:
    name: Checks
    needs: [changed, core, connector_check]
    if: ${{ !cancelled() && needs.changed.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both passed
        env:
          PART: ${{ needs.connector_check.result }}
          CORE: ${{ needs.core.result }}
        run: |
          echo "Connector (check): $PART, Core (check): $CORE"
          [ "$PART" = success ] && { [ "$CORE" = success ] || [ "$CORE" = skipped ]; }

  build:
    name: Connector build (${{ matrix.target }})
    needs: decide
    if: needs.decide.outputs.deliver == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # one target that does not build stops the others: there is no release without all four
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      TARGET: ${{ matrix.target }}
      # what the macOS binaries are linked with (connector/build-plugin.mjs): zig, by its published SHA-256, and
      # cargo-zigbuild
      ZIG_VERSION: 0.14.1
      ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
      ZIGBUILD_VERSION: 0.23.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # clang compiles ring's C for the Linux targets; zig links the macOS ones
      - name: Compiler (rust-toolchain.toml), clang, zig
        run: |
          set -eu
          sh .github/scripts/rust_toolchain.sh "$TARGET"
          clang --version | head -n 1
          case "$TARGET" in *-apple-darwin) ;; *) exit 0 ;; esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components 1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/zig/zig" version
      # the downloaded and compiled crates of this target (see env above); only main runs this job
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: zigbuild
        if: endsWith(matrix.target, '-apple-darwin')
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}-${{ env.ZIGBUILD_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: cargo-zigbuild
        if: endsWith(matrix.target, '-apple-darwin') && steps.zigbuild.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --version "$ZIGBUILD_VERSION" --locked
      # A target that did not build is an error here, not a smaller release.
      - name: Build
        run: |
          set -eu
          # the release number is compiled in: a connector refuses a release older than itself (update.rs)
          TROMMI_RELEASE_VERSION="$VERSION" node connector/build-plugin.mjs "$RUNNER_TEMP/dist" --targets "$TARGET"
          [ -f "$RUNNER_TEMP/dist/trommi-connector-$TARGET" ] || { echo "::error::no build for $TARGET"; exit 1; }
          mkdir out
          cp "$RUNNER_TEMP/dist/trommi-connector-$TARGET" out/
          file "out/trommi-connector-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-build-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  # The connector's release: the four binaries of build and the manifest that names them (the plugin for
  # Claude Code is no release file: it is the folder connector/plugin, which names the installed connector).
  assemble:
    name: Connector release
    needs: [decide, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      ALL_PARTS: ${{ needs.decide.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: connector-build-*
          merge-multiple: true
          path: out/
      - name: Put the release together
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "out/trommi-connector-$target" ] || { echo "::error::no build for $target"; exit 1; }
            # an artifact does not keep the executable bit
            chmod 755 "out/trommi-connector-$target"
            file "out/trommi-connector-$target"
          done
          [ "$(find out -type f | wc -l)" = 4 ] || { echo "::error::out/ holds more than the four binaries"; ls -la out; exit 1; }
          for f in out/trommi-connector-*-linux-musl; do
            file "$f" | grep -Eq 'static(ally|-pie) linked' || { echo "::error::$f is not a static binary"; exit 1; }
          done
          # the connector's inputs (whether a later commit must publish it again: .github/scripts/deployed.sh)
          PARTS=$(printf '%s\n' "$ALL_PARTS" | grep -E '^connector [0-9a-f]{64} (true|false)$' || true)
          [ -n "$PARTS" ] || { echo "::error::the connector's inputs are not known"; exit 1; }
          PARTS="$PARTS" release/manifest.sh trommi-connector "$VERSION" "$GITHUB_SHA" out/* > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" out/manifest.json
          release/sign.sh files out/manifest.json
          cat out/manifest.json
      # The very file that will be released is started once.
      - name: Try the built connector
        run: out/trommi-connector-x86_64-unknown-linux-musl --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  # When this push changed the hub: wait until the server runs this commit's hub and updater (.github/scripts/
  # deployed.sh says nothing is left to deliver), at most 45 minutes; else nothing is released (the next run tries).
  hub:
    name: The hub of this commit runs
    needs: [decide, checks, assemble]
    if: >-
      ${{ !cancelled() && needs.decide.outputs.deliver == 'true' && needs.decide.outputs.hub == 'true'
      && needs.checks.result == 'success' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for the hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          sh .github/scripts/inputs.sh > "$RUNNER_TEMP/inputs"
          for i in $(seq 1 90); do
            if [ "$(sh .github/scripts/deployed.sh "$RUNNER_TEMP/inputs" hub)" = hub=false ]; then
              echo "the server runs the hub and the updater of $GITHUB_SHA"
              exit 0
            fi
            echo "round $i: the server does not run this commit's hub yet"
            sleep 30
          done
          echo "::error::the server does not run the hub of $GITHUB_SHA after 45 minutes: no connector is released"
          exit 1

  # The connector's signed release connector-v<N>: its checks (and the core's) and its four builds passed, and, when
  # this push changed the hub, the server runs it.
  release:
    name: Connector release
    needs: [decide, checks, assemble, hub]
    if: >-
      ${{ !cancelled() && needs.decide.outputs.deliver == 'true' && needs.checks.result == 'success'
      && needs.assemble.result == 'success' && (needs.decide.outputs.hub != 'true' || needs.hub.result == 'success') }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/sign-release.yml
    with:
      part: connector
      version: ${{ needs.decide.outputs.version }}
      commit: ${{ github.sha }}
      artifact: connector-release
    secrets: inherit

  # A failed run: open the issue "Connector build connector-v<N> failed" (label build-failed) or comment on it; when
  # all passed, close it.
  report:
    name: Report
    needs: [decide, checks, build, assemble, hub, release]
    if: ${{ !cancelled() && needs.decide.outputs.deliver == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: connector-v${{ needs.decide.outputs.version }}
      WHAT: build
      RUNNING: the commit built, ${{ github.sha }}
      LABEL: build-failed
      RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, comment on or close the issue
        run: |
          set -eu
          REASON="failed: $(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')"
          export REASON
          sh .github/scripts/deploy_issue.sh Connector
