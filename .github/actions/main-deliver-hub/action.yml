name: main-deliver-hub
description: The main pipeline steps for main-deliver-hub
inputs:
  tag:
    description: Signed release tag
    default: ''
  webhook-url:
    description: Repository deployment credential
    required: true
  cf-client-id:
    description: Repository deployment credential
    required: true
  cf-client-secret:
    description: Repository deployment credential
    required: true
  deploy-token:
    description: Repository deployment credential
    required: true
outputs:
  reason:
    description: reason
    value: ${{ steps.outside.outputs.reason }}
  running:
    description: running
    value: ${{ inputs.tag }}
runs:
  using: composite
  steps:
  - name: Record the hub deployment
    id: deployment
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      set -eu
      [ "$GITHUB_REF" = refs/heads/main ]
      jq -n --arg ref "$GITHUB_SHA" '{ref:$ref,environment:"hub",auto_merge:false,required_contexts:[],production_environment:true}' > "$RUNNER_TEMP/hub-deployment.json"
      id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input "$RUNNER_TEMP/hub-deployment.json" --jq .id)
      printf '%s' "$id" | grep -Eq '^[1-9][0-9]*$'
      echo "id=$id" >> "$GITHUB_OUTPUT"
      gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress -f environment_url=https://hub.trommi.com > /dev/null
  - name: Check Access, deploy the fixed target, verify public commit
    id: outside
    shell: bash
    env:
      DEPLOY_WEBHOOK_URL: ${{ inputs.webhook-url }}
      CF_ACCESS_CLIENT_ID: ${{ inputs.cf-client-id }}
      CF_ACCESS_CLIENT_SECRET: ${{ inputs.cf-client-secret }}
      DEPLOY_TOKEN: ${{ inputs.deploy-token }}
    run: python3 .github/scripts/hub_deliver.py
  - name: Record the hub result
    if: always() && steps.deployment.outputs.id != ''
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT: ${{ steps.deployment.outputs.id }}
      STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
    run: |
      set -eu
      gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT/statuses" -f "state=$STATE" -f environment_url=https://hub.trommi.com > /dev/null
