name: main-build-apple
description: The main pipeline steps for main-build-apple
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
  - name: What the core for Swift is built from
    id: core_inputs
    run: |
      set -eu
      tree=$(sh .github/scripts/source_tree.sh HEAD core/ Cargo.toml Cargo.lock rust-toolchain.toml .github/actions/check-ios-client/action.yml .github/actions/main-build-apple/action.yml .github/actions/main-sign-mac-direct/action.yml .github/workflows/pr-check.yml .github/workflows/ship-apple.yml .github/workflows/main.yml .github/workflows/main-delivery.yml .github/workflows/main-part.yml)
      xcode=$(xcodebuild -version)
      sum=$(printf '%s\n%s\n' "$tree" "$xcode" | shasum -a 256 | cut -c1-64)
      echo "key=ios-core-$RUNNER_OS-$RUNNER_ARCH-$sum" >> "$GITHUB_OUTPUT"
    shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    id: core_cache
    with:
      key: ${{ steps.core_inputs.outputs.key }}
      path: |
        core/bindings/swift/TrommiCoreRust/lib
        core/bindings/swift/TrommiCoreRust/Sources/TrommiCoreFFI/include/TrommiCoreFFI.h
        core/bindings/swift/TrommiCoreRust/Sources/TrommiCoreRust/TrommiCoreRust.swift
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - name: Compiler (rust-toolchain.toml)
    if: steps.core_cache.outputs.cache-hit != 'true'
    run: |
      set -eu
      rustup toolchain install || rustup show
      rustup component add llvm-tools
      rustc --version
      xcodebuild -version
    shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
    if: steps.core_cache.outputs.cache-hit != 'true'
    with:
      prefix-key: v2-rust
      save-if: ${{ github.ref == 'refs/heads/main' }}
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - name: The Rust core for Swift
    if: steps.core_cache.outputs.cache-hit != 'true'
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
      TROMMI_SIMULATOR: '0'
    run: |
      set -eu
      DARWIN_CLANG_RT="$(xcrun --sdk iphoneos clang -print-resource-dir)/lib/darwin"
      export DARWIN_CLANG_RT
      sh core/bindings/swift/build.sh
    shell: bash
  - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    if: steps.core_cache.outputs.cache-hit != 'true'
    with:
      key: ${{ steps.core_inputs.outputs.key }}
      path: |
        core/bindings/swift/TrommiCoreRust/lib
        core/bindings/swift/TrommiCoreRust/Sources/TrommiCoreFFI/include/TrommiCoreFFI.h
        core/bindings/swift/TrommiCoreRust/Sources/TrommiCoreRust/TrommiCoreRust.swift
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - name: Test
    run: swift test --package-path tests/bindings/swift -j 4
    shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - name: App Store Connect steps (fixtures)
    run: python3 -B -m unittest discover -s tests/ios/asc -v
    shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - name: Put the release together
    run: |
      set -eu
      package=core/bindings/swift/TrommiCoreRust
      mkdir -p out/lib/ios out/lib/macos out/Sources/TrommiCoreFFI/include out/Sources/TrommiCoreRust
      cp "$package/lib/ios/libtrommi_core_ffi.a" out/lib/ios/
      cp "$package/lib/macos/libtrommi_core_ffi.a" out/lib/macos/
      cp "$package/Sources/TrommiCoreFFI/include/TrommiCoreFFI.h" out/Sources/TrommiCoreFFI/include/
      cp "$package/Sources/TrommiCoreRust/TrommiCoreRust.swift" out/Sources/TrommiCoreRust/
      printf 'commit: %s\n' "$COMMIT" > out/build.txt
      (cd out && find . -type f | sed 's|^\./||' | sort | xargs shasum -a 256 > "$RUNNER_TEMP/checksums.txt")
      mv "$RUNNER_TEMP/checksums.txt" out/checksums.txt
      cat out/checksums.txt
    shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
  - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
    with:
      overwrite: true
      name: ios-release
      path: out/
      if-no-files-found: error
      retention-days: 30
    env:
      CARGO_INCREMENTAL: '0'
      COMMIT: ${{ github.sha }}
