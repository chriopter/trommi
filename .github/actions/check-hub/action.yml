# The steps of the job "Hub (check)" (pr-check.yml on a pull request; the part's ship-*.yml on main). The caller checks out the repository first.
name: Hub (check)
description: The steps of the check Hub (check)
runs:
  using: composite
  steps:
    - name: Compiler (rust-toolchain.toml), clippy
      shell: bash
      run: sh .github/scripts/rust_toolchain.sh --component clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: v2-rust
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
      with:
        tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
    - name: Clippy
      shell: bash
      run: cargo clippy --locked -p trommi-hub -p trommi-hub-updater --all-targets -- -D warnings
    # the hub's tests and the deploy path's (updater, release form, settings)
    - name: Test
      shell: bash
      run: |
        set -eu
        tests=$(sed -n 's/^name = "\(\(hub\|deploy\)_[a-z0-9_]*\)"$/--test \1/p' tests/Cargo.toml | tr '\n' ' ')
        [ -n "$tests" ] || { echo "::error::tests/Cargo.toml names no hub test"; exit 1; }
        # shellcheck disable=SC2086
        cargo nextest run --locked -p trommi-tests --no-fail-fast $tests
    - name: Scripts of the deploy path
      shell: bash
      run: |
        set -eu
        # notes of the lowest level differ between shellcheck versions and do not stop the build
        shellcheck -S warning release/*.sh hub/deploy/*.sh .github/scripts/hub_container_check.sh .github/scripts/hub_image_sign.sh .github/scripts/install_cosign.sh
        bash hub/deploy/install.sh check

# The app's client package (app/ios/TrommiClient) with its tests (tests/ios), on Linux: the package does not compile
# for macOS (ActivityKit). A pull request compiles it with its tests; ship-apple.yml runs them.
    - name: Deployment HTTP contract (local fixtures)
      shell: bash
      run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/hub_deliver_test.py
    - name: Consistent backup and interrupted-snapshot recovery (isolated fixtures)
      shell: bash
      run: PYTHONDONTWRITEBYTECODE=1 python3 hub/container/backup_test.py
