[package]
name = "trommi-client-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The client core: the board and Desk model, its settle and hand-back rules, the catch-up plan and the store interface, shared by the web app (wasm), the iOS app (UniFFI) and the Linux app. No IO: hosts fetch, the core decides."

[dependencies]
# What the hub reads the same way: the refusal codes and their statuses, the limits of its routes (core/wire).
trommi-wire = { path = "../wire" }
# The protocol core: ids, and the board items and stroke pieces as it reads them (the codec reuses its rules).
trommi-core = { path = "../protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
# raw_value: a body is read without building its values (codec.rs)
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }

[dev-dependencies]
# The seeded random source, for the test that runs one script twice (tests/engine.rs). Never in a shipped build.
trommi-core = { path = "../protocol", features = ["vectors"] }
