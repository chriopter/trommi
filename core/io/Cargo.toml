[package]
name = "trommi-io"
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "The native executor of the app core's effects: HTTP and the event stream (reqwest, tokio), the device journal, the cache folder, the timer, and the loop that owns an App. For the Linux app; never part of the wasm or iOS builds."

[dependencies]
trommi-client-core = { path = "../client" }
trommi-core = { path = "../protocol" }
# The journal of the device space (store.rs): the connector's, as the Linux app has used it from its first version.
trommi-connector = { path = "../../connector" }
tokio = { version = "=1.53.2", features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util"] }
