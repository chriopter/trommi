# Trommi for Linux: a Qt/QML window drawing the app core (core/client), bound by cxx-qt. A workspace of its own, so that
# the main workspace's `cargo test --workspace` needs no Qt; its versions follow the main Cargo.lock (copied, then
# extended by the Qt crates only).
[workspace]

[package]
name = "trommi-linux"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE.md"
description = "Trommi for Linux: a window that draws the app core: sign in, the Desk, sessions and cards, live."

[[bin]]
name = "trommi-linux"
path = "src/main.rs"

[lib]
name = "trommi_linux"
path = "src/lib.rs"

[dependencies]
# The app core, which decides every screen, and its native executor: HTTP, the event stream, the stores, the loop.
trommi-client-core = { path = "../../core/client" }
trommi-io = { path = "../../core/io" }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "=1.0.151"
# Desktop notifications over the session D-Bus (notify.rs).
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[dev-dependencies]
# the real hub's tests drive the room through the connector's stand-ins (tests/hub.rs, tests/connector/common)
trommi-core = { path = "../../core/protocol" }
trommi-connector = { path = "../../connector" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
